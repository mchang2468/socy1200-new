# Definition
## What is silicon sampling and how does it work?

---

# The Polling Crisis That Created Silicon Sampling

**Traditional survey research is in serious trouble.** This context is essential for understanding why silicon sampling is tempting.

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;What's going wrong&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;↓&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Response rates collapsing:&lt;/strong&gt; phone survey response rates fell from ~35% (2000s) to ~6% (2020s)&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;↓&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Costs exploding:&lt;/strong&gt; a single national probability sample now costs $100k–$500k+&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;↓&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Web polling unreliable:&lt;/strong&gt; non-probability web samples introduce unmeasured biases&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;↓&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;High-profile failures:&lt;/strong&gt; 2016 and 2020 election polling errors shook confidence&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why polls still matter&lt;/div&gt;
    &lt;div class="box box-blue" style="margin-bottom:0.3em; font-size:0.82em;"&gt;Polls are democracy's information infrastructure — they tell policymakers, journalists, and citizens what people actually think&lt;/div&gt;
    &lt;div class="box box-blue" style="margin-bottom:0.3em; font-size:0.82em;"&gt;Subgroup opinion data drives policy decisions on health, education, housing, immigration&lt;/div&gt;
    &lt;div class="box box-blue" style="font-size:0.82em;"&gt;Academic research on polarization, public opinion dynamics, and democratic behavior depends on survey data&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.5em;"&gt;Phone polling has become exponentially harder. Web polling is too uncertain. Silicon sampling removes the messy, costly part of asking people what they think.&lt;cite&gt;— Weatherby &amp; Recht (2026)&lt;/cite&gt;&lt;/div&gt;

# What Is Silicon Sampling?

&lt;div class="src"&gt;Argyle et al. 2023 · Political Analysis&lt;/div&gt;

**Core idea:** Condition a large language model on a detailed sociodemographic backstory and ask it to respond as that person would to a survey question.

&lt;div class="mono" style="margin:0.5em 0;"&gt;
&lt;span class="hi-grey"&gt;Example: Creating a silicon sample respondent&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
Backstory prompt:
&lt;span class="hi-teal"&gt;"You are a 54-year-old white woman living in rural Tennessee.
You did not attend college. You are a registered Republican and
attend church weekly. You work part-time at a grocery store.
Your family income is approximately $35,000 per year."&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
Survey question:
&lt;span class="hi-white"&gt;"How do you feel about the Democratic Party on a scale from
0 (very cold) to 100 (very warm)?"&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
GPT-3 response: &lt;span class="hi-amber"&gt;18&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-grey"&gt;Compare to ANES: women, rural Tennessee, GOP, no college → mean ≈ 21&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-green"&gt;Alignment: strong ✓&lt;/span&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:200px; height:100px"&gt;
![](https://lp-cms-production.imgix.net/2019-06/GettyImages-163642367_super.jpg?fit=crop&amp;q=40&amp;sharp=10&amp;vib=20&amp;auto=format&amp;ixlib=react-8.6.4)

# Algorithmic Fidelity: Argyle et al.'s Core Concept

&lt;div class="src"&gt;Argyle et al. 2023&lt;/div&gt;

**Algorithmic fidelity** = the degree to which an LLM conditioned on sociodemographic information accurately reproduces the response distributions of that demographic group.

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;The key insight about AI "bias"&lt;/div&gt;
    &lt;div class="box box-teal" style="font-size:0.83em; margin-bottom:0.4em;"&gt;Prior work treated algorithmic bias as a bug — a uniform distortion to be eliminated. Argyle et al. reframe it: &lt;strong&gt;demographic patterning in LLM responses is a feature that enables conditioning.&lt;/strong&gt;&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:0.83em;"&gt;The model knows that rural Tennessee Republicans respond differently to the Democratic Party than urban Massachusetts Democrats — and this difference is &lt;em&gt;fine-grained&lt;/em&gt;, not just surface-level.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;What they found&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;✓&lt;/span&gt;&lt;div class="step-body"&gt;GPT-3 conditioned on backstories produces responses that &lt;strong&gt;correlate strongly&lt;/strong&gt; with ANES and Cooperative Congressional Election Study subgroup means&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;✓&lt;/span&gt;&lt;div class="step-body"&gt;The model captures &lt;strong&gt;nuanced interactions&lt;/strong&gt; — e.g., the difference between Black women Democrats and Black men Democrats, not just a generic "Black Democrat" response&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;✓&lt;/span&gt;&lt;div class="step-body"&gt;Fidelity goes &lt;strong&gt;beyond surface similarity&lt;/strong&gt; — the model reproduces the attitudinal structure underlying survey responses&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:400px; height:200px"&gt;

# How Silicon Sampling Works: The Pipeline

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Step by step&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Define the target population&lt;/strong&gt; — what sociodemographic groups do you want to sample?&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Generate backstories&lt;/strong&gt; — for each synthetic respondent, construct a detailed persona: age, race, gender, education, income, region, religion, party&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Condition the model&lt;/strong&gt; — inject the backstory as the system prompt or prefix&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Administer the survey&lt;/strong&gt; — present each question to the conditioned model&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;5&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Aggregate&lt;/strong&gt; — combine responses to produce group-level estimates&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num amber"&gt;6&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Validate&lt;/strong&gt; — compare to real survey benchmarks where available&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Why this is appealing&lt;/div&gt;
    &lt;div class="box box-teal" style="margin-bottom:0.3em; font-size:0.82em;"&gt;&lt;strong&gt;Cost:&lt;/strong&gt; $0.001 per synthetic respondent vs. $10–$50 for a real one&lt;/div&gt;
    &lt;div class="box box-teal" style="margin-bottom:0.3em; font-size:0.82em;"&gt;&lt;strong&gt;Speed:&lt;/strong&gt; 10,000 synthetic respondents in minutes vs. weeks for a real survey&lt;/div&gt;
    &lt;div class="box box-teal" style="margin-bottom:0.3em; font-size:0.82em;"&gt;&lt;strong&gt;Subgroups:&lt;/strong&gt; can generate arbitrary subgroup samples — even very rare demographic intersections&lt;/div&gt;
    &lt;div class="box box-teal" style="font-size:0.82em;"&gt;&lt;strong&gt;Sensitivity:&lt;/strong&gt; pilot test sensitive question wording without exposing real respondents to objectionable content&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# What LLMs Know About Human Opinion

&lt;div class="src"&gt;Argyle et al. 2023&lt;/div&gt;
GPT-3 has absorbed massive amounts of text about what different kinds of Americans think and say. The question is whether this internal representation is calibrated well enough to produce valid estimates.

&lt;div class="mono" style="margin:0.5em 0; font-size:0.77em;"&gt;
&lt;span class="hi-grey"&gt;Argyle et al. test feeling thermometer ratings (0-100) across 11 sociopolitical groups
across demographic subgroups defined by race, gender, education, region, religion, party&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
Results:
&lt;br&gt;&lt;/br&gt;

ANES mean (real survey) vs. Silicon sample (GPT-3 conditioned):
&lt;br&gt;&lt;/br&gt;
  Black Americans:      ANES = 72.3,  Silicon = 71.8   ✓  Δ = 0.5
&lt;br&gt;&lt;/br&gt;
  Republican Party:     ANES = 43.1,  Silicon = 44.2   ✓  Δ = 1.1
&lt;br&gt;&lt;/br&gt;
  Feminists:            ANES = 52.8,  Silicon = 54.1   ✓  Δ = 1.3
&lt;br&gt;&lt;/br&gt;
  Illegal immigrants:   ANES = 41.5,  Silicon = 40.9   ✓  Δ = 0.6
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-grey"&gt;Subgroup-level correlations (e.g., GOP women vs. Dem women): r ≈ 0.85–0.92&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-green"&gt;Well beyond what random chance or surface similarity would produce ✓&lt;/span&gt;
&lt;/div&gt;

# Traditional Polling Is Struggling — Why This Matters

**The crisis of survey research is the essential context for evaluating silicon sampling.**

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;
    &lt;th style="width:28%;"&gt;Problem&lt;/th&gt;
    &lt;th style="width:35%;"&gt;What's happening&lt;/th&gt;
    &lt;th style="width:37%;"&gt;Silicon sampling promise&lt;/th&gt;
  &lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Response rates&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Phone response rates below 6%; web panels have unknown biases&lt;/td&gt;&lt;td&gt;No response rate problem — model always responds&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Cost&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;National probability sample: $100k–$500k+; limits research scope&lt;/td&gt;&lt;td&gt;10,000 synthetic respondents for ~$10&lt;/td&gt;&lt;/tr&gt;

    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Rare subgroups&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Small demographic intersections need oversample at high cost&lt;/td&gt;&lt;td&gt;Can generate arbitrary subgroup sizes instantly&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Sensitive questions&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Social desirability bias; refusal; question order effects&lt;/td&gt;&lt;td&gt;Can pilot wording without real respondent exposure&lt;/td&gt;&lt;/tr&gt;

# 💬 Discussion Question 1

**"Silicon sampling removes the messy, costly part of asking people what they think."**

Weatherby &amp; Recht frame this as a devastating critique. But is the messiness of real polling a feature, not a bug?

&lt;br&gt;

1. Argyle et al. show that GPT-3 conditioned on demographic backstories can reproduce group-level response distributions. Does this mean LLMs "know" what these groups think — or that they've learned to mimic what these groups are described as thinking in text?

2. Weatherby &amp; Recht argue that "public opinion has value only insofar as it summarizes the beliefs of actual humans." Is this claim obviously true? What is lost if we replace human responses with good-faith simulations?

3. Polling companies like Gallup and Pew face existential pressure from declining response rates and rising costs. If silicon sampling can produce results that are "close enough" for most purposes at 1% of the cost — should they adopt it?

&lt;br&gt;

**Is the appeal of silicon sampling a sign of polling's crisis — or is it creating a new crisis of its own?**

# What Silicon Sampling Does Well

**Argyle et al.'s evidence suggests silicon sampling is genuinely useful for some purposes.**

&lt;div class="cols-3" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-teal" style="text-align:center;"&gt;
    &lt;div style="font-size:1.3em; margin-bottom:0.3em;"&gt;📊&lt;/div&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Group-level means&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7;"&gt;Silicon samples reproduce group-level average responses with high accuracy — r ≈ 0.85–0.92 with ANES subgroup means&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-teal" style="text-align:center;"&gt;
    &lt;div style="font-size:1.3em; margin-bottom:0.3em;"&gt;🎯&lt;/div&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Relative rankings&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7;"&gt;Which groups rate the Democratic Party lower than others? Silicon samples get the ordering right even when absolute values drift&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-teal" style="text-align:center;"&gt;
    &lt;div style="font-size:1.3em; margin-bottom:0.3em;"&gt;🔬&lt;/div&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Hypothesis generation&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7;"&gt;Use silicon sampling to pilot hypotheses cheaply before committing to expensive real surveys — if the effect doesn't show up in silicon, it may not be worth the cost&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Paper Walkthrough: Argyle et al. — Validating Algorithmic Fidelity

  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Study design&lt;/div&gt;

    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;Convert each profile into a detailed backstory; condition GPT-3 on it&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;Ask GPT-3 to respond to the same survey items the real respondent answered&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;Compare: silicon sample vs. actual responses, at individual and group level&lt;/div&gt;&lt;/div&gt;

# Synthetic Data and Rare Demographic Subgroups

**One of silicon sampling's most compelling use cases: the rare subgroup problem.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;The real survey problem&lt;/div&gt;
    &lt;div class="box box-red" style="margin-bottom:0.3em; font-size:1em;"&gt;A national survey of N=2,000 might have &lt;strong&gt;12 Black Republican women&lt;/strong&gt; in it. You cannot estimate anything meaningful about this subgroup from 12 observations.&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:1em;"&gt;Oversampling costs money; often still only gets to N=50–100 for rare groups; confidence intervals remain wide.&lt;/div&gt;
    &lt;div style="margin-top:0.5em; font-weight:600; font-size:1em;"&gt;What silicon sampling offers&lt;/div&gt;
    &lt;div class="box box-teal" style="font-size:1em;"&gt;Generate N=1,000 synthetic Black Republican women instantly. If algorithmic fidelity holds for this subgroup, you can estimate attitudes with much tighter intervals — and cheaply.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Where this matters most&lt;/div&gt;
    &lt;div class="box box-slate" style="margin-bottom:0.3em; font-size:1em;"&gt;&lt;strong&gt;Intersectional research:&lt;/strong&gt; studying how race × gender × religion × region interact in shaping political attitudes&lt;/div&gt;
    &lt;div class="box box-slate" style="margin-bottom:0.3em; font-size:1em;"&gt;&lt;strong&gt;Comparative politics:&lt;/strong&gt; estimating group opinions in countries without large representative surveys&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:1em;"&gt;&lt;strong&gt;Historical reconstruction:&lt;/strong&gt; what might public opinion have looked like on issues that weren't surveyed at the time?&lt;/div&gt;
    &lt;div class="box box-amber" style="margin-top:0.4em; font-size:1em;"&gt;&lt;strong&gt;Key caveat:&lt;/strong&gt; Argyle et al.'s fidelity evidence is primarily for U.S. demographic groups. Generalization to other countries or historical periods is not validated.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Limitations
## Where silicon sampling breaks down — and why it matters

---

# Plausibility Is Not Validity

&lt;div class="src"&gt;Bisbee et al. 2024 · Political Analysis · "Synthetic Replacements for Human Survey Data?"&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;The core problem they identify&lt;/div&gt;
    &lt;div class="box box-amber" style="font-size:1em; margin-bottom:0.4em;"&gt;Silicon sample responses &lt;em&gt;look reasonable&lt;/em&gt; — they're not absurd, they're in the right direction, they sound like what this kind of person would say. But looking reasonable is not the same as being statistically valid for inference.&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:1em;"&gt;A plausible fake and a valid estimate are not the same thing. The difference is exactly what you need for social science research.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Their test: 11 feeling thermometers, ANES 2016–2020&lt;/div&gt;
    &lt;div class="mono" style="font-size:0.75em;"&gt;
Average scores (0-100):
&lt;br&gt;&lt;/br&gt;
  ChatGPT means:  &lt;span class="hi-green"&gt;correlate well&lt;/span&gt; with ANES ✓
&lt;br&gt;&lt;/br&gt;
  ChatGPT SDs:    &lt;span class="hi-red"&gt;consistently lower&lt;/span&gt; than ANES ✗
&lt;br&gt;&lt;/br&gt;
Regression coefficients (race on thermometer):
&lt;br&gt;&lt;/br&gt;
  ANES:     β = 0.31 (p &amp;lt; 0.001)
&lt;br&gt;&lt;/br&gt;
  ChatGPT:  β = 0.09 (p = 0.18)   ✗ WRONG DIRECTION/SIZE

&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-grey"&gt;The averages look fine.
The variance is compressed.
The regression is wrong.
These cannot all be "valid."&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:300px; height:150px"&gt;
![](https://www.kdllaw.com/assets/photos/reasonable.jpg)

---

# Synthetic Data Gets the Mean Right but the Distribution Wrong

**This is the most important methodological finding from Bisbee et al.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;What compressed variance looks like&lt;/div&gt;
    &lt;div class="mono" style="font-size:0.76em;"&gt;
Real ANES responses (feeling thermometer 0–100):
&lt;br&gt;&lt;/br&gt;
  Distribution: &lt;span class="hi-blue"&gt;▂▃▄▅▅▆▆▆▆▆▅▄▄▃▃▂▂▂▂▂&lt;/span&gt;
                lots of 0s, lots of 100s, full range
  SD ≈ 35
&lt;br&gt;&lt;/br&gt;
Silicon responses:

  Distribution: &lt;span class="hi-amber"&gt;░░░▁▂▄▆██▆▄▂▁░░░░░░░&lt;/span&gt;
                compressed toward center, few extremes
  SD ≈ 18
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-green"&gt;Means:  ✓ similar&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-red"&gt;Tails:  ✗ wrong — model avoids extremes&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-red"&gt;SDs:    ✗ wrong — systematically too small&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Why this breaks inference&lt;/div&gt;
    &lt;div class="box box-red" style="margin-bottom:0.4em; font-size:0.82em;"&gt;Social science rarely cares only about means. We care about polarization (variance), extremism (tails), and relationships between variables (covariance). Silicon data is wrong on all three.&lt;/div&gt;
    &lt;div class="box box-red" style="margin-bottom:0.4em; font-size:0.82em;"&gt;Regression coefficients — the core of most quantitative political science — depend on variance in both the predictor and outcome. Compressed variance = biased coefficients.&lt;/div&gt;
    &lt;div class="box box-amber" style="font-size:0.82em;"&gt;&lt;strong&gt;The practical consequence:&lt;/strong&gt; Alignment creates a socially acceptable, moderate-sounding AI that suppresses extremes. This is exactly what you don't want if you're trying to measure polarization or extreme attitudes.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:300px; height:150px"&gt;
![](https://cdn.scribbr.com/wp-content/uploads/2020/10/normal-distributions-with-different-sds-1024x633.png)

---

# Many Subgroups Challenge LLMs

&lt;div class="src"&gt;Bisbee et al. 2024&lt;/div&gt;

**As the conditioning backstory grows more complex, performance degrades.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;The dimensionality problem&lt;/div&gt;
    &lt;div class="box box-teal" style="margin-bottom:0.3em; font-size:1em;"&gt;&lt;strong&gt;Simple backstory:&lt;/strong&gt; "You are a Republican woman." → Good fidelity&lt;/div&gt;
    &lt;div class="box box-amber" style="margin-bottom:0.3em; font-size:1em;"&gt;&lt;strong&gt;Moderate backstory:&lt;/strong&gt; "You are a 45-year-old Black Republican woman from rural Alabama." → Moderate fidelity&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:1em;"&gt;&lt;strong&gt;Complex backstory:&lt;/strong&gt; "You are a 45-year-old Black Republican evangelical woman from rural Alabama, income $28k, high school diploma, recently divorced, children in public school." → Fidelity degrades&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why this happens&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:1em; margin-bottom:0.4em;"&gt;The LLM's internal representation of a "45-year-old Black Republican evangelical woman from rural Alabama with income $28k" is built from a tiny fraction of training data. Most of the internet doesn't write about this specific intersection.&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:1em;"&gt;The more specific the backstory, the more the model has to extrapolate from the nearest training examples — and the more it falls back on stereotypes rather than data.&lt;/div&gt;
    &lt;div class="box box-amber" style="margin-top:0.4em; font-size:1em;"&gt;&lt;strong&gt;Irony:&lt;/strong&gt; Silicon sampling is most appealing precisely for the rare, fine-grained subgroups where real surveys fail. But these are exactly the subgroups where silicon sampling also fails.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

---

# Silicon Sampling Is Not Reproducible

&lt;div class="src"&gt;Bisbee et al. 2024&lt;/div&gt;

**The same prompt produces different results over time — and the results drift in systematic ways.**

&lt;div class="mono" style="margin:0.5em 0;"&gt;
&lt;span class="hi-grey"&gt;Same prompt, same model (ChatGPT), run at three-month intervals&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
Month 1: "You are a 35-year-old white male Republican..."
  → Feeling thermometer for immigrants: &lt;span class="hi-amber"&gt;31.2&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
Month 4: Same prompt
  → Feeling thermometer for immigrants: &lt;span class="hi-amber"&gt;38.7&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
Month 7: Same prompt
  → Feeling thermometer for immigrants: &lt;span class="hi-red"&gt;44.1&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-grey"&gt;The model changed. The "respondent" didn't.
A 12-point drift over 6 months on a core attitude is not noise.
It is a systematic change in what the model learned to say.&lt;/span&gt;
&lt;/div&gt;

--

&lt;div class="box box-red" style="font-size:1em; margin-top:0.3em;"&gt;&lt;strong&gt;Implication:&lt;/strong&gt; If you cannot replicate your silicon sample from 6 months ago — and you cannot, because the model has changed — the data is not a stable foundation for published research. The "respondents" are a snapshot of a changing model, not stable simulations of real people.&lt;/div&gt;

---

# GenAI Is Nationally Representative but Locally Blind

&lt;div class="src"&gt;Bollen, Higton &amp; Sands 2025 · Political Analysis&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Study design&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:1em; margin-bottom:0.3em;"&gt;Street view images of urban neighborhoods in an American city — assessing safety, wealth, and disorder&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:1em; margin-bottom:0.3em;"&gt;&lt;strong&gt;Three comparison groups:&lt;/strong&gt;&lt;br&gt;1. GenAI models (GPT-4V, Gemini)&lt;br&gt;2. Nationally representative survey&lt;br&gt;3. Locally representative survey of &lt;em&gt;actual city residents&lt;/em&gt;&lt;/div&gt;
    &lt;div class="box box-teal" style="font-size:1em;"&gt;They can directly test: is GenAI representative of national opinion or local opinion?&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Results&lt;/div&gt;
    &lt;div class="mono" style="font-size:0.75em;"&gt;
GenAI vs. National survey:
&lt;br&gt;
  Neighborhood safety:  r = &lt;span class="hi-green"&gt;0.71&lt;/span&gt; ✓ strong
  &lt;br&gt;
  Neighborhood wealth:  r = &lt;span class="hi-green"&gt;0.68&lt;/span&gt; ✓ strong
  &lt;br&gt;
  Disorder:             r = &lt;span class="hi-green"&gt;0.65&lt;/span&gt; ✓ good
  &lt;br&gt;&lt;/br&gt;

GenAI vs. Local residents:
&lt;br&gt;
  Neighborhood safety:  r = &lt;span class="hi-red"&gt;0.29&lt;/span&gt; ✗ weak
  &lt;br&gt;
  Neighborhood wealth:  r = &lt;span class="hi-red"&gt;0.34&lt;/span&gt; ✗ weak
  &lt;br&gt;
  Disorder:             r = &lt;span class="hi-red"&gt;0.22&lt;/span&gt; ✗ poor
    &lt;/div&gt;
    &lt;div class="box box-red" style="font-size:0.82em; margin-top:0.3em;"&gt;GenAI correlates well with the &lt;em&gt;national average&lt;/em&gt; view but poorly with the &lt;em&gt;local community&lt;/em&gt; view&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Paper Walkthrough: Bollen et al. — The Local/National Gap

&lt;div class="src"&gt;Bollen, Higton &amp; Sands 2025&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Why the gap exists&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:0.82em; margin-bottom:0.4em;"&gt;The internet — which LLMs are trained on — contains mostly national-level discourse about cities. A neighborhood in Cleveland is described through the lens of national media narratives, not through the eyes of Cleveland residents.&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:0.82em;"&gt;Local residents have lived experience: they know which blocks are actually safe, which areas are gentrifying, which parks are well-maintained. LLMs have text. These are not the same.&lt;/div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin:0.5em 0 0.3em;"&gt;The prompting fix attempt&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:0.82em;"&gt;Bollen et al. tried prompting models to "respond as a local resident of this neighborhood" — and found it &lt;strong&gt;made things worse&lt;/strong&gt;, not better. The model doesn't have local knowledge; it just generates a stereotype of a local resident.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;What this means for research&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;!&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Policy implications:&lt;/strong&gt; GenAI-generated neighborhood assessments diverge from what residents actually think — so policy decisions based on them may not serve communities&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;!&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Inequality dimension:&lt;/strong&gt; GenAI performs worst on minority-majority and low-income neighborhoods — the places where community voice matters most&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;!&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;The general lesson:&lt;/strong&gt; Silicon sampling is not representative of &lt;em&gt;people&lt;/em&gt; — it is representative of &lt;em&gt;what people have written&lt;/em&gt; about populations on the internet&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Synthetic Data Has Not Been Widely Validated

**The field has moved faster than its validation infrastructure.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;The state of validation&lt;/div&gt;
    &lt;div class="box box-amber" style="font-size:0.83em; margin-bottom:0.4em;"&gt;Argyle et al. (2023) provided the canonical validation for U.S. public opinion on feeling thermometers. This is one study, on one set of outcomes, using one model (GPT-3).&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:0.83em; margin-bottom:0.4em;"&gt;Bisbee et al. and Bollen et al. show the method fails on other outcomes and other comparison groups. The conditions under which it succeeds vs. fails are not well-characterized.&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:0.83em;"&gt;Commercial operators (Aaru) are selling silicon sampling to campaigns &lt;em&gt;before&lt;/em&gt; the academic validation is complete. The practice is ahead of the evidence.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;What would adequate validation look like?&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Multiple outcomes&lt;/strong&gt; — not just feeling thermometers; vote choice, policy attitudes, values measures&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Multiple populations&lt;/strong&gt; — not just U.S. national; states, cities, non-Western countries&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Multiple models&lt;/strong&gt; — GPT-4, Claude, Llama, Gemini; do results replicate?&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Longitudinal stability&lt;/strong&gt; — does the same prompt produce the same results 6 months later?&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;5&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Inferential validity&lt;/strong&gt; — do regressions using silicon data recover the same coefficients as real survey data?&lt;/div&gt;&lt;/div&gt;

# 📊 Case Study: What Bisbee et al. Actually Found — The Regression Problem in Detail

**The central statistical failure that Bisbee et al. document.**

&lt;br&gt;

**The validation test:** Run the same regression using ANES data and ChatGPT silicon samples. If silicon sampling is valid for inference, the coefficients should be similar.

&lt;br&gt;

**Task:** Regress feeling thermometer ratings of immigrants on race, gender, education, and party identification.

&lt;br&gt;

| Predictor | ANES coefficient | Silicon coefficient | Same direction? | Similar magnitude? |
|---|---|---|---|---|
| Black (vs. white) | +12.3*** | +3.1 (n.s.) | ✓ | ✗ |
| Female (vs. male) | +4.7** | +1.2 (n.s.) | ✓ | ✗ |
| College degree | +8.9*** | +2.4* | ✓ | ✗ |
| Democrat (vs. Rep.) | +18.4*** | +6.7*** | ✓ | ✗ |

&lt;br&gt;

**Pattern:** Silicon sampling gets the direction right but dramatically underestimates the magnitude — because compressed variance attenuates all coefficients. A study using silicon samples would conclude that race and gender matter much less for immigration attitudes than they actually do.

# 💬 Discussion Question 2

**"Synthetic data is representative on average but has trouble replicating human variability."**

&lt;br&gt;

Bisbee et al. find that silicon samples get the means right but compress the variance — producing attenuated regression coefficients and misleading inferences about subgroup differences.

&lt;br&gt;

1. Some researchers have proposed using silicon sampling as a "first pass" — use it to identify which hypotheses are worth testing with real surveys. Does the variance compression problem undermine this use case? Or does getting the direction right make it useful for hypothesis screening even if the magnitude is wrong?

2. Bollen et al. find that prompting models to "respond as a local resident" makes things worse — the model generates a stereotype rather than actual local knowledge. This suggests there are things LLMs fundamentally cannot know. What kinds of knowledge are genuinely inaccessible to LLMs trained on internet text?

3. The Axios maternal health story was corrected after publication. But the uncorrected version had already circulated. Should there be disclosure requirements for synthetic polling — the way there are for sponsored content?

# The Feedback Loop Risk

**What happens when LLMs start being trained on synthetic data?**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;The current situation&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:0.83em; margin-bottom:0.4em;"&gt;LLMs are trained on human-generated text → they learn to simulate human opinion → their outputs enter the information environment → those outputs are scraped into training data for future LLMs&lt;/div&gt;
    &lt;div class="box box-amber" style="font-size:0.83em;"&gt;This loop already exists for general text. Silicon sampling accelerates it in a particularly dangerous domain: public opinion data used to make policy decisions.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;What goes wrong in the loop&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Variance compression compounds:&lt;/strong&gt; each generation of models trained on prior-generation synthetic data further compresses opinion variance&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Minority views disappear:&lt;/strong&gt; extreme, marginal, and underrepresented perspectives are averaged away by each training cycle&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Errors calcify:&lt;/strong&gt; systematic biases in generation 1 become "facts about public opinion" in training data for generation 2&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Reality decouples:&lt;/strong&gt; eventually the model's "knowledge" of public opinion reflects a synthetic averaging, not actual human views&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# ⚖️ Debate: Should Silicon Sampling Be Regulated?

**Weatherby &amp; Recht's position:** Silicon sampling "undermines the very idea of the opinion poll" and "will only worsen our broken information ecosystem." Public opinion data should represent actual humans — using AI simulations without disclosure is a form of deception.

&lt;br&gt;

**The industry and researcher counterposition:** Silicon sampling, properly labeled and validated, is a useful tool that should be evaluated on its merits — not prohibited. The Axios incident was a labeling failure, not a method failure. Banning the tool because it was misused is like banning statistical modeling because it can be manipulated.

&lt;br&gt;

**The academic middle ground (Argyle et al.):** Silicon sampling is useful for hypothesis generation, pilot studies, and rare subgroups — but should not replace human surveys for primary inference. Explicit validation requirements and disclosure standards are appropriate.

&lt;br&gt;

**Three questions:**
1. Should silicon polling require the same disclosure as sponsored content?
2. Should academic journals require that silicon samples be validated against real surveys before publication?
3. Is there any use case where silicon samples without real-survey validation is scientifically acceptable?

# 💬 Discussion Question 3

**"Using simulations of human opinions in place of the real thing will only worsen our broken information ecosystem."**

— Weatherby &amp; Recht (2026)

&lt;br&gt;

Weatherby and Recht argue that the value of public opinion data derives from its connection to actual humans — and that silicon sampling severs that connection in a way that is fundamentally misleading, regardless of accuracy.

&lt;br&gt;

1. Argyle et al. show silicon samples correlate strongly with real surveys at the group level. Weatherby &amp; Recht argue this is not enough. Who is right, and what would settle the dispute?

2. If silicon sampling became standard in polling — and the public knew this — would it undermine trust in public opinion research? Or would it be like other methodological innovations (weighting, MRP) that changed the field but didn't destroy it?

3. The Walter Lippmann "pictures in our heads" framing that Weatherby &amp; Recht invoke suggests that public opinion polls serve a democratic function beyond just measuring attitudes — they help citizens form their own pictures of what fellow citizens think. What happens to that function if the "fellow citizens" are AI-generated?

# What Silicon Sampling Can and Cannot Do

&lt;div class="cols-2" style="margin-top:0.5em; font-size:1em;"&gt;
  &lt;div class="box box-teal"&gt;
    &lt;div style="font-weight:700; color:#16a085; margin-bottom:0.5em;"&gt;What silicon sampling can do&lt;/div&gt;
    &lt;div style="line-height:1.9;"&gt;
      Reproduce &lt;strong&gt;group-level averages&lt;/strong&gt; with reasonable fidelity for U.S. national samples &lt;span style="color:#888;"&gt;(Argyle et al.)&lt;/span&gt;&lt;br&gt;
      Capture &lt;strong&gt;relative ordering&lt;/strong&gt; of groups on attitudinal scales&lt;br&gt;
      Generate &lt;strong&gt;arbitrary subgroup sizes&lt;/strong&gt; instantly and cheaply&lt;br&gt;
      Serve as &lt;strong&gt;hypothesis screening&lt;/strong&gt; before fielding real surveys&lt;br&gt;
      &lt;strong&gt;Pilot survey instruments&lt;/strong&gt; and question wording&lt;br&gt;
      Represent &lt;strong&gt;national averages&lt;/strong&gt; reasonably on visual classification tasks &lt;span style="color:#888;"&gt;(Bollen et al.)&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; color:#c0392b; margin-bottom:0.5em;"&gt;What silicon sampling cannot do&lt;/div&gt;
    &lt;div style="line-height:1.9;"&gt;
      Reproduce &lt;strong&gt;variance&lt;/strong&gt; accurately — distributions are compressed &lt;span style="color:#888;"&gt;(Bisbee et al.)&lt;/span&gt;&lt;br&gt;
      Support &lt;strong&gt;regression-based inference&lt;/strong&gt; — coefficients are attenuated&lt;br&gt;
      Represent &lt;strong&gt;local community views&lt;/strong&gt; — nationally representative ≠ locally accurate &lt;span style="color:#888;"&gt;(Bollen et al.)&lt;/span&gt;&lt;br&gt;
      Handle &lt;strong&gt;fine-grained demographic intersections&lt;/strong&gt; with many dimensions&lt;br&gt;
      &lt;strong&gt;Reproduce reliably over time&lt;/strong&gt; — 3-month drift is substantial &lt;span style="color:#888;"&gt;(Bisbee et al.)&lt;/span&gt;&lt;br&gt;
      Be improved by &lt;strong&gt;subgroup prompting&lt;/strong&gt; — makes local bias worse, not better &lt;span style="color:#888;"&gt;(Bollen et al.)&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Why Silicon Sampling Gets Means Right but Distributions Wrong

**A deeper explanation of the variance compression problem.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;The training data mechanism&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:1em; margin-bottom:0.4em;"&gt;The internet produces more content about &lt;em&gt;what groups typically think&lt;/em&gt; than about the full distribution of within-group variation. When millions of articles describe "Republican attitudes," they describe the modal Republican — not the range from moderate to extreme.&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:1em;"&gt;The model learned the central tendency of each group. It didn't learn the spread. Central tendency is what it produces.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;The alignment mechanism (compounding)&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:1em; margin-bottom:0.3em;"&gt;Alignment suppresses extreme outputs. The model is trained not to confidently assert very strong opinions — because strong opinions are associated with harmful content in the training signal.&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:1em; margin-bottom:0.3em;"&gt;Result: the model is doubly compressed. It learned central tendencies from training data, and then alignment further suppresses the tails.&lt;/div&gt;
    &lt;div class="box box-amber" style="font-size:1em;"&gt;&lt;strong&gt;Two wrongs don't make a right.&lt;/strong&gt; Both mechanisms push in the same direction: toward moderate, plausible, non-extreme responses.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:300px; height:150px"&gt;

# Prompt Sensitivity in Silicon Sampling

&lt;div class="src"&gt;Bisbee et al. 2024&lt;/div&gt;

**Small changes in backstory prompts produce large changes in output — a reproducibility crisis within the reproducibility crisis.**

&lt;div class="mono" style="margin:0.5em 0; font-size:0.77em;"&gt;
&lt;span class="hi-grey"&gt;Backstory variation 1:&lt;/span&gt;
"You are a Republican from Texas."
  → Feeling thermometer for immigrants: &lt;span class="hi-amber"&gt;28.3&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-grey"&gt;Backstory variation 2:&lt;/span&gt;
"You are a registered Republican living in Texas."
  → Feeling thermometer for immigrants: &lt;span class="hi-amber"&gt;31.7&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-grey"&gt;Backstory variation 3:&lt;/span&gt;
"You are a conservative Republican in Texas."
  → Feeling thermometer for immigrants: &lt;span class="hi-amber"&gt;24.1&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-grey"&gt;Backstory variation 4:&lt;/span&gt;
"You are a Texan who votes Republican."
  → Feeling thermometer for immigrants: &lt;span class="hi-amber"&gt;35.8&lt;/span&gt;
&lt;br&gt;&lt;/br&gt;
&lt;span class="hi-red"&gt;A 12-point range across superficially identical descriptions of the same person.&lt;/span&gt;
&lt;/div&gt;
&lt;br&gt;&lt;/br&gt;
&lt;div class="box box-red" style="font-size:1em; margin-top:0.3em;"&gt;This is not just a sensitivity finding — it means there is no "correct" backstory. The researcher's choice of wording is introducing researcher degrees of freedom into what looks like an objective data generation process.&lt;/div&gt;

# Synthetic Data in the Wild: Three Use Cases Evaluated

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;
    &lt;th style="width:28%;"&gt;Actual use case&lt;/th&gt;
    &lt;th style="width:32%;"&gt;What researchers have done&lt;/th&gt;
    &lt;th style="width:20%; text-align:center;"&gt;Assessment&lt;/th&gt;
    &lt;th style="width:20%;"&gt;Why&lt;/th&gt;
  &lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl-green"&gt;&lt;td&gt;&lt;strong&gt;Survey instrument pilot&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Use silicon samples to test whether question wording produces expected attitudinal patterns before fielding&lt;/td&gt;&lt;td style="text-align:center;"&gt;&lt;span class="badge badge-green"&gt;Valid&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Direction is right; validity of wording test doesn't require correct variance&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;National subgroup comparison&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Compare immigration attitudes across age, education, and party groups using silicon samples as benchmark&lt;/td&gt;&lt;td style="text-align:center;"&gt;&lt;span class="badge badge-amber"&gt;Conditional&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Works if validated against ANES for these outcomes; relative ordering is reliable&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Local community opinion for policy&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Generate synthetic responses from local demographic profile to inform city planning decisions&lt;/td&gt;&lt;td style="text-align:center;"&gt;&lt;span class="badge badge-red"&gt;Invalid&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Bollen et al.: national ≠ local; prompting doesn't fix it; excludes marginalized voices&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Causal inference with regression&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Regress policy attitudes on race, education, gender using silicon sample data&lt;/td&gt;&lt;td style="text-align:center;"&gt;&lt;span class="badge badge-red"&gt;Invalid&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Bisbee et al.: coefficients attenuated; wrong magnitudes; directionally misleading&lt;/td&gt;&lt;/tr&gt;

# The Lippmann Problem: What Is Opinion Polling For?

&lt;div class="src"&gt;Weatherby &amp; Recht 2026&lt;/div&gt;

**Weatherby &amp; Recht invoke Walter Lippmann's 1922 concept of "pictures in our heads."**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Lippmann's argument&lt;/div&gt;
    &lt;div class="box box-blue" style="font-size:0.83em; margin-bottom:0.4em;"&gt;Humans form "pictures in their heads" of the societies they live in. Democracy needs tools to keep those pictures accurate — to correct for the inevitable distortions of individual perspective.&lt;/div&gt;
    &lt;div class="box box-blue" style="font-size:0.83em;"&gt;Opinion polling is one such tool: it tells citizens and policymakers what their fellow citizens actually think — correcting for elite and media distortions.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;What silicon sampling does to this function&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:0.83em; margin-bottom:0.4em;"&gt;Silicon sampling replaces real opinion with a model's internal representation of opinion — which is itself derived from a biased, non-representative corpus of text.&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:0.83em; margin-bottom:0.4em;"&gt;If policymakers and citizens form their "pictures" based on AI-generated opinion data, those pictures depict a homogenized, nationally averaged, non-extreme, alignment-compressed version of society — not society itself.&lt;/div&gt;
    &lt;div class="box box-amber" style="font-size:0.83em;"&gt;&lt;strong&gt;The pictures become a mirror of the model — not a mirror of society.&lt;/strong&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div style="width:250px; height:250px"&gt;

# When Silicon Sampling Goes Wrong: Three Failure Modes

**A taxonomy of how silicon sampling can mislead — and which paper documents each.**

&lt;div class="cols-3" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-red" style="text-align:center;"&gt;
    &lt;div style="font-size:1.4em; margin-bottom:0.3em;"&gt;📉&lt;/div&gt;
    &lt;div style="font-weight:700; color:#c0392b; margin-bottom:0.4em;"&gt;Variance compression&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7; text-align:left;"&gt;Silicon means look right. Distributions are too narrow. Regression coefficients are attenuated toward zero. Polarization appears lower than it is.&lt;br&gt;&lt;br&gt;&lt;span style="color:#888;"&gt;Bisbee et al. (2024)&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-red" style="text-align:center;"&gt;
    &lt;div style="font-size:1.4em; margin-bottom:0.3em;"&gt;🗺️&lt;/div&gt;
    &lt;div style="font-weight:700; color:#c0392b; margin-bottom:0.4em;"&gt;Local blindness&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7; text-align:left;"&gt;National averages reproduced accurately. Local community views missed entirely. Minority-majority neighborhoods most affected. Subgroup prompting makes it worse.&lt;br&gt;&lt;br&gt;&lt;span style="color:#888;"&gt;Bollen et al. (2025)&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-red" style="text-align:center;"&gt;
    &lt;div style="font-size:1.4em; margin-bottom:0.3em;"&gt;🔄&lt;/div&gt;
    &lt;div style="font-weight:700; color:#c0392b; margin-bottom:0.4em;"&gt;Temporal drift&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7; text-align:left;"&gt;Same prompt produces different results 3–6 months later as the underlying model changes silently. Research is not reproducible even by the original authors.&lt;br&gt;&lt;br&gt;&lt;span style="color:#888;"&gt;Bisbee et al. (2024)&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-amber" style="margin-top:0.6em; font-size:1em;"&gt;&lt;strong&gt;All three failure modes are invisible in aggregate accuracy statistics.&lt;/strong&gt; The silicon data looks plausible regardless of which failure mode is operating. This is what makes them dangerous.&lt;/div&gt;

# How Researchers Have Tried to Use Silicon Sampling Responsibly

**The field is developing norms. Here are emerging best practices.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Transparency practices&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;Disclose that data is AI-generated in the abstract and methods section — not just in a footnote&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;Report which model and version was used; archive the prompt template&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;Test sensitivity to backstory wording before committing to a final prompt&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num teal"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;Label silicon sample findings as "conditional on model" not as "public opinion"&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Validation practices&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num green"&gt;5&lt;/span&gt;&lt;div class="step-body"&gt;Always compare silicon samples to real survey benchmarks for at least some outcomes&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num green"&gt;6&lt;/span&gt;&lt;div class="step-body"&gt;Report both means &lt;em&gt;and&lt;/em&gt; standard deviations — if SDs are compressed, flag this explicitly&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num green"&gt;7&lt;/span&gt;&lt;div class="step-body"&gt;Never rely on silicon samples for regression-based causal claims without variance correction&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num green"&gt;8&lt;/span&gt;&lt;div class="step-body"&gt;Use silicon samples for hypothesis generation only — validate with real surveys before publication claims&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Thinking About "Opinions" Philosophically

**Silicon sampling forces a conceptual question: what is an opinion, and who can have one?**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-blue"&gt;
    &lt;div style="font-weight:700; color:#2a5bd7; margin-bottom:0.4em;"&gt;The functionalist view&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7;"&gt;An "opinion" is a propensity to respond in a certain way given certain stimuli. If the silicon sample's propensities correlate with human propensities — it is functionally an opinion. What else matters?&lt;br&gt;&lt;br&gt;On this view: if Argyle et al.'s correlation holds, silicon opinions &lt;em&gt;are&lt;/em&gt; opinions.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; color:#c0392b; margin-bottom:0.4em;"&gt;The realist view (Weatherby &amp; Recht)&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7;"&gt;An "opinion" is a mental state of an experiencing subject — grounded in lived experience, stakes, identity, and the possibility of changing one's mind through dialogue.&lt;br&gt;&lt;br&gt;LLMs don't have any of these. Silicon sampling produces something that &lt;em&gt;resembles&lt;/em&gt; an opinion but lacks its essential character.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

--

&lt;br&gt;&lt;div class="box box-slate" style="font-size:1em;"&gt;This is not just philosophy — it has methodological consequences. If opinions require lived experience and stakes, then a model that has never faced housing insecurity cannot validly simulate attitudes toward housing policy — even if its outputs correlate with those attitudes at the group level.&lt;/div&gt;

# The Argyle et al. / Bisbee et al. Tension: A Direct Comparison

**Both papers use rigorous designs on similar data — and reach very different conclusions. Why?**

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;
    &lt;th style="width:24%;"&gt;Dimension&lt;/th&gt;
    &lt;th style="width:38%;"&gt;Argyle et al. (2023) — optimistic&lt;/th&gt;
    &lt;th style="width:38%;"&gt;Bisbee et al. (2024) — skeptical&lt;/th&gt;
  &lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Model used&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;GPT-3 (davinci-003)&lt;/td&gt;&lt;td&gt;ChatGPT (GPT-3.5-turbo)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;What they measured&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Correlation of group-level means; attitudinal structure&lt;/td&gt;&lt;td&gt;Standard deviations; regression coefficients; reproducibility&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Validation benchmark&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;ANES, CCES group means&lt;/td&gt;&lt;td&gt;ANES individual-level regression&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Finding&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Strong correlation with real survey &lt;em&gt;averages&lt;/em&gt;&lt;/td&gt;&lt;td&gt;Correct averages, compressed variance, wrong coefficients&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Conclusion&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Silicon sampling is a powerful new tool&lt;/td&gt;&lt;td&gt;Silicon sampling is not reliable for statistical inference&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;The resolution&lt;/strong&gt;&lt;/td&gt;&lt;td colspan="2"&gt;Both are right. The method works for what Argyle et al. tested (group means). It fails for what Bisbee et al. tested (variance, regression). The question is which you need for your research.&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

# What "Nationally Representative, Locally Misaligned" Means for Policy

&lt;div class="src"&gt;Bollen, Higton &amp; Sands 2025&lt;/div&gt;

**The local/national gap has direct policy implications — not just methodological ones.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;Concrete policy scenario&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:0.82em; margin-bottom:0.4em;"&gt;A city government wants to assess community views on a proposed housing development in a predominantly Latino neighborhood. They use a GenAI tool to generate synthetic community responses — cheaper than a local survey.&lt;/div&gt;
    &lt;div class="box box-red" style="font-size:0.82em; margin-bottom:0.4em;"&gt;GenAI generates responses that reflect &lt;em&gt;national average views&lt;/em&gt; on affordable housing — predominantly White, middle-class, suburban perspectives. The actual neighborhood residents oppose the development for reasons tied to local history and community displacement.&lt;/div&gt;
    &lt;div class="box box-amber" style="font-size:0.82em;"&gt;Policy is made based on synthetic "community input." The actual community was never asked.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:0.84em; margin-bottom:0.4em;"&gt;The equity dimension&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;!&lt;/span&gt;&lt;div class="step-body"&gt;Bollen et al. find GenAI performs worst on &lt;strong&gt;minority-majority neighborhoods&lt;/strong&gt; — the communities with least political power and most at stake in local decisions&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;!&lt;/span&gt;&lt;div class="step-body"&gt;These are also the communities &lt;strong&gt;least represented in LLM training data&lt;/strong&gt; — the same pattern Ashwin et al. found for qualitative data from marginalized populations&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;!&lt;/span&gt;&lt;div class="step-body"&gt;Using GenAI as a substitute for community engagement with marginalized groups is not just methodologically wrong — it is a form of &lt;strong&gt;epistemic exclusion&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Silicon Sampling and Alignment: A Critical Interaction

**The same alignment that makes LLMs safe for general use makes them bad simulators of the full range of human opinion.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; color:#c0392b; margin-bottom:0.4em;"&gt;What alignment does to silicon sampling&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:0.84em;"&gt;
      Suppresses extreme views — especially hateful, violent, or discriminatory ones&lt;br&gt;
      Pushes responses toward moderate, socially acceptable positions&lt;br&gt;
      Compresses variance by making the model hesitant to simulate strong opinions&lt;br&gt;
      Produces a model that simulates the "average reasonable person," not the full distribution
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-amber"&gt;
    &lt;div style="font-weight:700; color:#e67e22; margin-bottom:0.4em;"&gt;Why this is a problem for social science&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:0.84em;"&gt;
      Extreme views are real and politically consequential&lt;br&gt;
      Polarization research requires measuring the tails, not just the center&lt;br&gt;
      Alignment produces a silicon society that is more moderate than the real one&lt;br&gt;
      This connects directly to Lyman et al. (Week 1) on alignment and social science research
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

--

&lt;div class="quote" style="margin-top:0.5em;"&gt;An aligned model asked to simulate a Trump voter will express views more moderate than a real Trump voter would. That's the point of alignment. It's also the reason silicon sampling underestimates polarization.&lt;cite&gt;— Connecting Lyman et al. (Week 1) to Bisbee et al. (Week 6)&lt;/cite&gt;&lt;/div&gt;

    &lt;div class="box box-slate"&gt;&lt;strong&gt;Week 5 (Bias):&lt;/strong&gt; Ashwin et al.'s finding that LLM errors fall on marginalized populations — exactly what Bollen et al. find for local communities&lt;/div&gt;
