# Unit 1 Review
## Introduction: What LLMs are and how they work
#### Weeks 2–3

---

class: unit1

# Unit 1 · Core Ideas

**The five things you must know from the introduction:**

1. **LLMs are prediction machines** — they produce the statistically most likely next token given training. They are not reasoning, not understanding, not thinking. (Bender et al.; McCoy et al.)

2. **Task-agnostic by construction** — modern LLMs generalize across tasks without retraining. This makes them categorically different from prior AI systems. (Schulz-Schaeffer)

3. **Training data is destiny** — what's in the training data shapes everything: biases, capabilities, blind spots. More data ≠ better data. (Bender et al.)

4. **Fine-tuning matters more than model size** — instruction-tuned smaller models beat larger untuned ones. How you train shapes outputs as much as what you train. (Wei et al.; Wang et al.)

5. **Alignment is a layer, not a fix** — alignment suppresses explicit bias but does not eliminate implicit bias. It creates the paradox: useful for users, problematic for researchers who need the full distribution of human opinion. (Lyman et al.; Bai et al.)

# ❓ Review Question 1

&lt;center&gt;
**The "stochastic parrot" (Bender et al.) and "embers of autoregression" (McCoy et al.) framings agree on one thing and differ on emphasis. What do they agree on? What does each add?**

&lt;br&gt;

***Take 2 minutes to write a 3-sentence answer before we discuss.***

&lt;center&gt;
&lt;div style="width:500px; height:250px"&gt;
![](https://imgcdn.stablediffusionweb.com/2024/9/12/c32ddcee-f306-4cfd-8745-55d4c1698316.jpg)

---

class: answer

# ✅ Answer: Review Question 1

**What they agree on:**
Both hold that LLMs are NOT reasoning or understanding in any meaningful sense. They produce statistically plausible outputs without genuine comprehension of what those outputs mean or refer to.

&lt;br&gt;

**What Bender et al. add:**
The "stochastic parrot" framing emphasizes the *content* problem: what is in the training data encodes biases, and the model reproduces them at scale without awareness. It is a warning about accountability and social harm.

&lt;br&gt;

**What McCoy et al. add:**
The "embers" framing emphasizes the *predictive* problem: LLM behavior follows from training pressure. Tasks requiring low-probability outputs will fail; high-probability tasks will succeed. This makes failures **predictable** — a powerful scientific contribution.

&lt;br&gt;

**The key synthesis:** Bender tells us *what's in the parrot*. McCoy tells us *when the parrot will fail*. Together: LLMs encode biased content, and you can predict where that bias will show up.

# Unit 1 · The Three Framings

**Three different but compatible ways to understand what AI is — each leads to different questions:**

&lt;div class="cols-3" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-blue"&gt;
    &lt;div style="font-weight:700; color:#2a5bd7; margin-bottom:0.4em;"&gt;🔬 Mechanistic&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.8;"&gt;Next-word predictors trained on massive corpora. Capabilities follow from training pressures. Failures are predictable.&lt;br&gt;&lt;br&gt;&lt;em&gt;Best for: understanding why it works and why it fails&lt;/em&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-green"&gt;
    &lt;div style="font-weight:700; color:#27ae60; margin-bottom:0.4em;"&gt;⚙️ Technical&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.8;"&gt;Training data, fine-tuning parameters, context windows, alignment — all shape output. Methodological choices matter enormously.&lt;br&gt;&lt;br&gt;&lt;em&gt;Best for: designing studies and choosing tools&lt;/em&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-purple"&gt;
    &lt;div style="font-weight:700; color:#8e44ad; margin-bottom:0.4em;"&gt;🏛️ Institutional&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.8;"&gt;LLMs are cultural institutions — like libraries and universities — that shape how society accesses and reasons about knowledge.&lt;br&gt;&lt;br&gt;&lt;em&gt;Best for: understanding societal implications&lt;/em&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.6em;"&gt;You need all three framings. A mechanistic understanding without the institutional framing misses what's at stake. An institutional framing without the mechanistic one produces bad research design.&lt;/div&gt;

# ❓ Review Question 2

&lt;center&gt;

**Explain in 2–3 sentences why Lyman et al.'s finding about alignment is specifically a problem for social science research — even though alignment makes LLMs safer and more useful in general.**

&lt;br&gt;

***Take 90 seconds before we discuss.***

&lt;center&gt;
&lt;div style="width:350px; height:350px"&gt;
![](https://miro.medium.com/v2/resize:fit:740/1*MpbHxKjFIUUwL8oyHXPD-A.jpeg)

class: answer

# ✅ Answer: Review Question 2

**The core tension:**

Alignment makes LLMs safer by suppressing extreme, harmful, or antisocial outputs. This is good for most users — you don't want your chatbot endorsing violence.

**But for social science**, researchers often need the full range of human opinion — including extreme, fringe, and minority views. If you're studying political polarization, you need the model to simulate what an actual Trump voter or an actual progressive activist would say — not a moderated, aligned version of those views.

**The specific problem:** Lyman et al. show that aligned models compress opinion distributions toward the center. When you use an aligned model to simulate survey respondents, you get responses that are systematically more moderate than real humans would give. The result: you underestimate polarization, underestimate partisan differences, and produce research that mischaracterizes the distribution of human political attitudes.

**Bottom line:** Alignment optimizes for safety. Research often needs variance. These goals conflict.

# Unit 2 · Core Ideas (Part A: Prompting)

**The five things you must know about prompting:**

1. **Prompting is a design task, not a technical one** — the bottleneck is conceptual clarity, not coding skill. A good prompt is a good codebook. (Stuhler et al.)

2. **Output is highly sensitive to prompt wording** — small changes can produce large changes in output. This is a red flag for fragile measurement, not just a nuisance. (Griswold et al.)

3. **Chain-of-thought works by changing probability** — adding "let's think step by step" makes the correct output more probable by conditioning on intermediate reasoning steps. (Wei et al.)

4. **Few-shot examples are implicit definitions** — they teach the model *your* operationalization, not its default one. Example quality matters more than quantity. (Griswold et al.)

5. **Prompting cannot fix structural bias** — bias lives in the weights; the prompt affects the outputs but does not reach the weights. You cannot prompt your way out of demographic stereotyping. (Jeon et al.; Bai et al.)

# Unit 2 · Core Ideas (Part B: Measurement)

**The five things you must know about AI measurement:**

1. **Scale is no longer the constraint — validity is** — LLMs make large-N text classification trivially easy. The hard question is whether you're measuring what you think you are. (Benoit et al.; Halterman &amp; Keith)

2. **37% of conclusions change with model substitution** — switching LLMs reverses findings in more than one third of published studies. The finding is partly a property of the model, not the data. (Yang et al.)

3. **Errors are systematic, not random** — random errors average out; systematic errors bias estimates in predictable directions. LLM errors cluster by demographic content, text type, and rhetorical register. (Week 4 framework)

4. **Label clarity determines model selection** — for well-defined constructs, purpose-built small models (DEBATE) match or beat GPT-4. For fuzzy constructs, larger models have the advantage. (Burnham et al.)

5. **Supervised fine-tuning is the gold standard** — zero-shot → few-shot → fine-tuning: each step costs more but gains more validity. When you have labeled data, fine-tune. (Chae &amp; Davidson)

# ❓ Review Question 3

**Yang et al. find that 37% of published LLM-annotation studies reach different conclusions when a different model is used. What does this number tell us — and what should journals require as a result?**
&lt;center&gt;
&lt;br&gt;

Take 2 minutes. Try to give: (1) what it tells us, (2) at least two specific journal requirements it implies.

&lt;center&gt;
&lt;div style="width:600px; height:300px"&gt;
![](https://www.thinkai.cz/wp-content/uploads/2024/04/Main-image-1.jpg)

---

class: answer

# ✅ Answer: Review Question 3

**What 37% tells us:**

In more than one third of LLM-annotation studies, the choice of which model to use determines whether the finding is statistically significant, null, or even reversed. This means the "finding" is partly a product of measurement choice — not just data. The analogy: if switching survey instruments reversed your conclusions 37% of the time, we would not trust survey research.

**What journals should require:**

1. **Report exact model version** — not just "GPT-4" but "gpt-4-0613" — because models update without notice and the same name ≠ the same model at different times

2. **Test model substitution sensitivity** — re-run with at least one other model; report whether conclusions hold. Treat this like a robustness check.

3. **Report intercoder reliability (LLM vs. human)** — not just "the model agreed with humans X% of the time" but a proper reliability coefficient

4. **Archive raw LLM outputs** — not just the final labels but the raw outputs alongside the dataset, so others can reproduce

5. **Report accuracy by theoretically relevant subgroup** — aggregate accuracy hides subgroup failures

class: unit2

# Unit 2 · Core Ideas (Part C: Bias and Correction)

**The five things you must know about bias and correction:**

1. **Bias is demographically patterned in aligned models** — Bai et al.'s IAT-style measures reveal implicit bias across race, gender, religion, and health — even in models that pass standard bias benchmarks. Alignment suppresses explicit bias, not implicit structure.

2. **Covert bias is harder to detect than overt bias** — overt bias shows up in what the model says; covert bias shows up in how demographics condition what gets classified as what. Requires designed audits to detect.

3. **LLMs have a home culture** — Tan et al.: models trained on Western-dominant corpora apply Western frameworks by default. Cross-cultural research is fundamentally threatened unless cultural alignment is addressed.

4. **Errors fall on marginalized populations** — Ashwin et al.: errors cluster on populations underrepresented in training data — precisely the populations researchers most need to study carefully.

5. **Error correction requires knowing the error structure** — Maranca et al.'s DSL: standard regression assumes random error; AI errors are non-random. You must estimate the error structure from a validation sample and apply a correction. You cannot eliminate human coding; you can only reduce how much you need.

class: answer

# ✅ Answer: Review Question 4

**The cruel irony (two sentences):**

Marginalized, non-Western, and underrepresented populations are the groups most likely to be the focus of research requiring careful, high-quality measurement — and they are also the populations for which LLM training data is thinnest, most distorted, and least representative. So the tool fails most precisely where accuracy matters most.

**What Ashwin et al. recommend:**

1. **Expert-code a representative subsample** — not crowdworkers; trained sociologists who understand the population, language, and cultural context

2. **Train a bespoke supervised model** on that expert-coded subsample — not a general-purpose LLM, which has no calibrated representation of this population

3. **Apply the fine-tuned model** to the full corpus — it now learns *your* operationalization from *your* data, with errors that reflect your corpus rather than a generic training distribution biased against your population

4. **Audit by subgroup** — especially the population of primary theoretical interest

**The deeper point:** You cannot substitute a general model for specialized knowledge. Cultural and population expertise must be embedded in the training data, not just the prompt.

class: answer

# ✅ Answer: Activity 4 — The Six Problems

1. **"GPT-4" is not a model version** — which GPT-4? gpt-4-0613? gpt-4-turbo? These are different models with different behaviors.

2. **87% aggregate accuracy hides subgroup failures** — if the research question is about post-2020 criticism (which likely involves racial justice content), accuracy on that specific subset must be reported separately.

3. **The validation sample (N=200) is not described as representative** — is it stratified across years? Across topics? Across tone? "Random sample" is ambiguous.

4. **No model substitution sensitivity test** — Yang et al.: 37% of conclusions change with model substitution. This study does not test whether the β = 0.23 holds under a different model.

5. **No error audit** — are errors random or systematic? If the model systematically misclassifies ironic or satirical criticism as supportive (a known failure), the post-2020 finding may be an artifact.

6. **No demographic bias test** — police criticism is heavily racialized content. Jeon et al. show models have demographic shortcuts. Was this tested?

# Unit 3 Review
## Synthetic People: Silicon Sampling
#### Weeks 6–7

---

class: unit3

# Unit 3 · Core Ideas (Part A: What Silicon Sampling Is)

**The five things you must know about silicon sampling:**

1. **The core idea** — condition an LLM on a sociodemographic backstory and ask it to respond as that person would to survey questions. Term coined by Argyle et al. (2023).

2. **Algorithmic fidelity** — Argyle et al.'s concept: when properly conditioned, GPT-3 reproduces group-level attitude distributions with r ≈ 0.85–0.92 versus ANES. This goes beyond surface similarity.

3. **Why it's tempting** — traditional polling is in crisis: response rates below 6%, national probability samples costing $100k+. Silicon sampling costs pennies.

4. **The interchangeability assumption** — most silicon sampling studies assume LLM outputs and human outputs can be treated as the same thing. This assumption is empirically false.

5. **It's already being used commercially** — Weatherby &amp; Recht: the Axios maternal health case. Companies like Aaru sell synthetic polling to campaigns. The practice is ahead of its validation.

---

class: unit3

# Unit 3 · Core Ideas (Part B: Limitations)

**The five things you must know about silicon sampling's failures:**

1. **Variance compression** — Bisbee et al.: silicon samples get the mean right but compress distributions. SDs ~50% smaller than real surveys. Regression coefficients are attenuated.

2. **Nationally representative, locally blind** — Bollen et al.: GenAI correlates well with national surveys (r ≈ 0.65–0.71) but poorly with local community views (r ≈ 0.22–0.34). Subgroup prompting makes it worse.

3. **Many subgroups challenge LLMs** — performance degrades with specificity. The rare, intersectionally-defined subgroups most useful for research are exactly where fidelity is lowest.

4. **Not reproducible** — Bisbee et al.: same prompt produces different results over 3 months as models silently update. Silicon samples are not stable research instruments.

5. **Not widely validated** — Argyle et al. is one study, one model, one outcome type. The conditions under which fidelity holds vs. fails are not well-characterized.

---

# ❓ Review Question 5

**Bisbee et al. show that silicon samples get the mean right but fail on variance. Why does this matter for regression-based inference specifically? Give an example.**

&lt;br&gt;

Take 2 minutes. Your answer should include: (1) the mechanism, (2) a concrete example of how the regression conclusion would be wrong.

&lt;center&gt;
&lt;div style="width:600px; height:300px"&gt;
![](https://www.unite.ai/wp-content/uploads/2024/12/Apple-Silicon-Chips.webp)

---

class: answer

# ✅ Answer: Review Question 5

**The mechanism:**

Regression coefficients depend on variance in both the predictor and the outcome. When variance is compressed — as it systematically is in silicon samples — the estimated regression coefficients are attenuated toward zero. This is not random noise; it is a systematic bias in the direction of finding smaller effects.

**The formula (intuition):**

β̂ = Cov(X, Y) / Var(X). If Var(X) is inflated by compression (or Var(Y) is compressed), β̂ is biased downward.

**A concrete example:**

Real ANES data: Regress feeling thermometer toward immigrants on race (Black vs. white). Find β = +12.3 (Black respondents feel significantly warmer toward immigrants).

Silicon data (same question, same conditioning): β = +3.1, not significant.

**The wrong conclusion:** A researcher using silicon data would conclude that race has a small, non-significant effect on immigration attitudes. The real finding is a large, highly significant effect. The policy implication is completely different. The error is not noise — it is a consistent directional bias that misleads in a predictable way.

---

class: unit3

# Unit 3 · Core Ideas (Part C: PPI and Statistical Realism)

**The five things you must know about solutions:**

1. **LLMs as predictors, not simulators** — Broska et al.'s key reframing. Don't ask: "are LLM outputs equivalent to human outputs?" Ask: "how well do LLM predictions correlate with human outputs, and how can we use that correlation efficiently?"

2. **Prediction-powered inference (PPI)** — combine LLM predictions (large, cheap) with human observations (small, expensive) to produce valid estimates with proper confidence intervals. Validity guaranteed regardless of LLM accuracy.

3. **The PPI correlation (ρ)** — measures how informative LLM predictions are. Effective N = N_human + ρ² × N_llm. When ρ = 0.7, 100 humans + 1,000 LLM predictions gives ~590 effective observations.

4. **Statistical realism vs. surface plausibility** — Xie et al. / SSDataBench: "looks realistic" is not enough. Synthetic data must reproduce univariate distributions, bivariate associations, life event sequences, and multivariate regression patterns.

5. **Typological compression** — LLMs collapse heterogeneous distributions into a small number of idealized types. The more diverse the real-world distribution, the worse the LLM performs at reproducing it.

---

# ❓ Review Question 6

**A researcher wants to study the effect of a news story on immigration attitudes. They have a budget of $2,000 total. How would Broska et al.'s PPI framework suggest they proceed? What would a pure silicon sampling approach do, and why is it inferior?**

&lt;br&gt;
&lt;center&gt;
&lt;div style="width:600px; height:300px"&gt;
![](https://cdn.wmnf.org/wp-content/uploads/2024/05/US-Citizenship-and-immigration-services-migrants-by-Sundry-Photography-via-iStock-for-WMNF-News-scaled.jpg)

---

class: answer

# ✅ Answer: Review Question 6

**Pure silicon sampling approach (inferior):**

Generate 5,000 LLM personas, expose half to the news story, measure attitude shift using LLM outputs. Cost: ~$50. Problem: the interchangeability assumption fails. Variance is compressed, regression coefficients are attenuated, and the estimated treatment effect is wrong in a predictable direction (toward zero).

**Broska et al.'s PPI approach:**

Step 1: Generate N=3,000 LLM predictions for both treatment and control personas. Cost: ~$30.

Step 2: Use the remaining ~$1,970 to recruit ~50–100 real human participants (Prolific, $15–$20/person, ~90 minutes). Randomly assign to treatment and control.

Step 3: Estimate the PPI correlation (ρ) from the human-LLM overlap in the validation sample.

Step 4: Apply PPI correction using the full LLM prediction set and the human validation sample → valid ATE estimate with proper confidence intervals.

**Why it's better:** PPI guarantees valid inference regardless of how accurate the LLM is. The human sample anchors the estimate to ground truth. The LLM predictions amplify statistical power when ρ is moderate-to-high (which it often is for behavioral experiments in Broska et al.'s domain).

# ❓ Review Question 7

**Xie et al. find that LLMs handle categorical distributions better than continuous ones. Explain why, and give one example of a social science research design that would be safer vs. one that would be more problematic to use with synthetic data because of this difference.**

&lt;center&gt;
&lt;div style="width:700px; height:350px"&gt;
![](https://img.magnific.com/premium-vector/pie-chart-documents-reports-infographic_9493-68385.jpg)

---

class: answer

# ✅ Answer: Review Question 7

**Why categorical works better:**

Categorical variables have natural, discrete boundaries — "college degree or not," "married or divorced," "Democrat or Republican." The model can learn these distinctions clearly from training data, where these categories appear frequently and distinctly. There is no "between" category to be compressed toward.

Continuous variables have no natural boundaries. When the model is uncertain, it defaults to the center — which compresses the distribution. Alignment compounds this by discouraging extreme outputs. The result: income, attitude scales, health scores, and other continuous measures are systematically less variable than real data.

**Safer design (categorical outcome):**

A study using silicon samples to estimate the proportion of each demographic group that holds a college degree. The binary distinction is well-learned; the result would approximate reality reasonably.

**More problematic design (continuous outcome):**

A study using silicon samples to estimate the distribution of income across demographic groups and then regress income on education. The income distribution will be compressed, the regression coefficients will be attenuated, and the finding will systematically underestimate the income return to education.

# ❓ Review Question 8

**Integrate across all three units: explain in 4–5 sentences why the following statement is wrong, and what the correct version would be.**

&lt;br&gt;

*"AI makes social science research faster, cheaper, and more reliable. We can now use LLMs to classify text, simulate survey respondents, and test hypotheses — all without the expense of human coding or polling."*

&lt;br&gt;

Take 3 minutes to write before we discuss.

&lt;center&gt;
&lt;div style="width:250px; height:250px"&gt;
![](https://tse2.mm.bing.net/th/id/OIP.2tdIOAnCFx8JEhetOFKxTAHaHa?r=0&amp;rs=1&amp;pid=ImgDetMain&amp;o=7&amp;rm=3)

# ✅ Answer: Review Question 8

**What's wrong — line by line:**

"Faster and cheaper" — true for *generating data*, not for *validating it*. Measurement without validation is not research; it is noise with confidence intervals.

"More reliable" — false. Yang et al.: 37% of conclusions change with model substitution. LLM annotation is systematically *less* reliable than human coding, not more.

"Classify text" — partially true, but only with validation samples, subgroup accuracy audits, and model substitution tests. Errors are systematic, not random, and correct downstream inference requires DSL-style correction (Maranca et al.).

"Simulate survey respondents" — false as stated. Silicon samples get means right but compress variance, produce wrong regression coefficients, and fail on local populations, rare subgroups, and reproducibility. The interchangeability assumption fails.

**The correct version:**

AI makes generating candidate data faster and cheaper. But validity, reliability, and correct inference still require human validation samples, designed audits, bias correction, and — for synthetic respondents — the PPI framework. The constraint is no longer scale; it is validity. And validity requires more methodological rigor than traditional survey research, not less.

# Five Topics That Will Be on the Midterm

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div class="box box-amber" style="margin-bottom:0.4em;"&gt;
      &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;1. Mechanism-level explanations&lt;/div&gt;
      &lt;div style="font-size:1em; line-height:1.7;"&gt;Not just "LLMs have bias" but &lt;em&gt;why&lt;/em&gt; — training data, alignment, prediction pressure. Be able to explain the mechanism behind each finding.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class="box box-amber" style="margin-bottom:0.4em;"&gt;
      &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;2. Applying concepts to new scenarios&lt;/div&gt;
      &lt;div style="font-size:1em; line-height:1.7;"&gt;You'll be given a research scenario and asked to identify problems, recommend approaches, or predict failure modes. Use the frameworks from each unit.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class="box box-amber"&gt;
      &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;3. Paper attribution&lt;/div&gt;
      &lt;div style="font-size:1em; line-height:1.7;"&gt;Know which paper produced which finding. "37% of conclusions" is Yang et al. "r ≈ 0.85–0.92" is Argyle et al. "Means right, variance wrong" is Bisbee et al.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class="box box-amber" style="margin-bottom:0.4em;"&gt;
      &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;4. Cross-unit integration&lt;/div&gt;
      &lt;div style="font-size:1em; line-height:1.7;"&gt;The units are connected. Alignment (Unit 1) explains variance compression (Unit 3). Systematic errors (Unit 2) explain why interchangeability fails (Unit 3). The DSL framework (Unit 2) and PPI (Unit 3) solve analogous problems in different contexts.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class="box box-amber"&gt;
      &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;5. Distinguishing what can and cannot be fixed&lt;/div&gt;
      &lt;div style="font-size:1em; line-height:1.7;"&gt;You can fix: prompt wording, few-shot examples, validation sample design, error correction via DSL/PPI. You cannot fix: structural bias in weights via prompting, local blindness via subgroup prompting, variance compression without a correction framework, reproducibility with proprietary models.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
