# Unit 1: Introduction
## What is modern AI, and how does it work?

---

# Key Ideas: What Makes Modern AI Different

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Old AI vs. modern AI&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Modern AI (LLMs, generative AI, foundation models) is &lt;strong&gt;task-agnostic&lt;/strong&gt; — skilled at generalizing from prior experience, rather than built for one narrow task&lt;br&gt;
      - This generality is the key shift from earlier, narrow AI systems
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-slate"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;What LLMs fundamentally are&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Prediction machines: very good at predicting the next token, trained to function exactly the way they were trained&lt;br&gt;
      - This framing (vs. "understanding" or "reasoning") matters for how we interpret their outputs
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.5em;"&gt;The debate over whether LLMs are "stochastic parrots" merely recombining training data, or whether they show genuine emergent generalization, runs underneath everything else this unit covers.&lt;/div&gt;

# Key Ideas: Alignment — Good or Bad for Research?

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-green"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Why alignment is good&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Reduces harmful, offensive, or dangerous outputs&lt;br&gt;
      - Makes models more useful and predictable for everyday use&lt;br&gt;
      - Builds public and institutional trust in deployed systems
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Why alignment may not be ideal for social science research&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Alignment can suppress the very variation researchers want to study or measure&lt;br&gt;
      - A model trained to give safe, agreeable, "helpful" answers may not represent the diversity of real human opinion&lt;br&gt;
      - This tension foreshadows this course's later units on homogenization and sycophancy
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-amber" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;Hold onto this tension — a model built to be a good &lt;em&gt;product&lt;/em&gt; (safe, agreeable) is not automatically a good &lt;em&gt;research instrument&lt;/em&gt; (representative, variable, honest about disagreement).&lt;/div&gt;

# 💬 Review Questions: Unit 1

&lt;br&gt;

1. What does it mean to say modern LLMs are "task-agnostic," and why is this the key distinction from earlier AI systems?

2. Explain the difference between fine-tuning and instruction-tuning. Why does fine-tuning need to target the "right parameters" rather than simply training longer or on more data?

3. Give one reason alignment is beneficial for a commercial AI product, and one reason it could be a problem for a social scientist trying to use that same AI system as a research instrument.

4. Why might a larger training dataset fail to produce a better model? What matters more than sheer size?

# Unit 2: Prompting
## With application to measurement

---

# Key Ideas: Prompting Fundamentals

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;What prompting is&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Closer to a design task than a technical one&lt;br&gt;
      - A learnable skill — output is highly sensitive to how a prompt is phrased&lt;br&gt;
      - Choosing between adjusting prompts vs. fine-tuning depends on the problem and resources available
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-slate"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Core techniques&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      &lt;strong&gt;Chain-of-thought:&lt;/strong&gt; slows the model down, often improving results&lt;br&gt;
      &lt;strong&gt;Few-shot prompting:&lt;/strong&gt; sometimes effective, not universally&lt;br&gt;
      &lt;strong&gt;Codebooks:&lt;/strong&gt; make prompting more effective and systematic
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.5em;"&gt;A recurring theme: prompts need to match the task's complexity, concepts must be clearly explained, and LLM errors are systematic — not random — which is what makes them correctable.&lt;/div&gt;

# Key Ideas: Prompting for Measurement

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th style="width:32%;"&gt;Concept&lt;/th&gt;&lt;th style="width:68%;"&gt;What to remember&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Classification &amp;amp; annotation&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;LLMs make text classification and annotation much easier — but reliability is lower than most researchers assume&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Non-random errors&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Errors in LLM data annotation are systematic, not random — this is a serious problem because it can bias downstream conclusions in a consistent direction&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Demographic bias in annotation&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;LLMs show stereotypical demographic biases specifically when annotating political data&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Zero-shot vs. few-shot&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Zero-shot works best with conceptual clarity in the task; few-shot prompting helps when that clarity is harder to achieve&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Fine-tuned BERT vs. larger LLMs&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;A fine-tuned BERT classifier with high label clarity can outperform much larger general-purpose models&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Validity requirements&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;High validity measurement requires high accuracy on well-defined constructs — vague constructs undermine validity regardless of model accuracy&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

---

# Key Ideas: Bias, Errors, and Correction

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;The bias problem&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - LLM bias is demographically patterned — not random noise&lt;br&gt;
      - Covert bias is harder to detect than overt bias&lt;br&gt;
      - LLMs are not culturally neutral&lt;br&gt;
      - Errors tend to fall disproportionately on marginalized, underrepresented, and foreign populations
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-teal"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Correcting for it&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Correction requires knowing the &lt;em&gt;systemic&lt;/em&gt; causes and patterns of errors — not just their existence&lt;br&gt;
      - Design-based supervised learning (DSL) approaches can help statistically correct for known bias patterns&lt;br&gt;
      - Better raw model performance does not automatically mean better research conclusions
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-amber" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;Replication is a persistent challenge in this space — a major reason LLM-based measurement research can be almost impossible to replicate exactly.&lt;/div&gt;

&lt;center&gt;

&lt;div class="section-num"&gt;III&lt;/div&gt;

# Unit 3: Synthetic People
## Can AI stand in for human research participants?

---

# Key Ideas: Silicon Sampling

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;What it is and why it's appealing&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Silicon sampling: using LLMs to generate synthetic human-like responses in place of, or alongside, real survey/experiment participants&lt;br&gt;
      - LLMs can relatively accurately emulate responses from specific demographic groups&lt;br&gt;
      - Traditional polling is struggling (declining response rates, cost), making synthetic alternatives appealing&lt;br&gt;
      - Synthetic data can be more representative at larger scopes than small human samples
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;The core limitations&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Plausibility of a generated opinion is not the same as validity for research purposes&lt;br&gt;
      - Synthetic data is representative &lt;em&gt;on average&lt;/em&gt;, but struggles to replicate real human variability&lt;br&gt;
      - Prompts spanning many subgroups at once are especially challenging for LLMs&lt;br&gt;
      - Synthetic data has low reproducibility and has been widely used without being widely validated
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.4em;"&gt;A forward-looking risk raised in this unit: what happens if future LLMs are trained partly on synthetic data generated by earlier LLMs? This is the same contamination/feedback-loop concern that reappears in Unit 5.&lt;/div&gt;

---

# Key Ideas: Limitations and Solutions

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th style="width:30%;"&gt;Concept&lt;/th&gt;&lt;th style="width:70%;"&gt;What to remember&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Mixed experimental designs&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Combine human and synthetic data to maintain validity — most useful when traditional data collection is expensive&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Predictors vs. simulators&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;LLMs tend to function better as predictors of human responses than as simulators that fully replicate human response processes&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Prediction-powered inference (PPI)&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;A statistical framework for combining a small amount of costly human-labeled data with a larger amount of AI-generated data, while maintaining valid inference&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Categorical vs. continuous&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;LLMs handle categorical distributions better than continuous ones — a practical constraint on what synthetic data can be trusted for&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Calibration&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Human validation samples are needed to calibrate synthetic data for maximum validity — synthetic data should not be trusted "as is"&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Demographic unevenness&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;LLMs produce better synthetic data for well-represented demographic groups, and worse data for underrepresented ones&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

# Unit 4: AI in Experiments
## Dynamic materials, persuasion, and conversation as treatment

---

# Key Ideas: Dynamic Materials

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-green"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Advantages&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Increases feasibility of experimental designs that would be too labor-intensive with human-generated materials&lt;br&gt;
      - AI can improve the quality of political discussions in experiments&lt;br&gt;
      - High-quality debates should be evidence-based and respectful in tone&lt;br&gt;
      - Personable AI outputs increase persuasiveness
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Limitations&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - AI can be dangerous by shifting political opinions, linguistic choices, and thought patterns&lt;br&gt;
      - Biased autocomplete recommendations can alter perspectives in non-natural ways&lt;br&gt;
      - Effects depend on whether participants notice AI's biases&lt;br&gt;
      - Participants may give inauthentic responses if they mistake a casual conversation for a formal debate&lt;br&gt;
      - Open question: how much disclosure is owed to participants about AI-generated content?
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Key Ideas: Persuasiveness — The Four Studies Recap

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th style="width:18%;"&gt;Study&lt;/th&gt;&lt;th style="width:41%;"&gt;Headline finding&lt;/th&gt;&lt;th style="width:41%;"&gt;Key numbers&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Costello et al.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Personalized AI dialogue durably reduces conspiracy belief&lt;/td&gt;&lt;td&gt;~20% belief reduction, held at 2-month follow-up&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Salvi et al.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Personalized GPT-4 outperforms humans in live debate&lt;/td&gt;&lt;td&gt;64.4% win rate; 81.2% higher odds of persuading&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Hackenburg et al.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Post-training and prompting drive persuasiveness — at a cost to accuracy&lt;/td&gt;&lt;td&gt;+51% (post-training), +27% (prompting); persuasion↑ → accuracy↓&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Argyle et al.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Customization and elaboration did NOT clearly beat a generic message&lt;/td&gt;&lt;td&gt;Null result — a useful counterweight to the other three&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

&lt;div class="box box-indigo" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;&lt;strong&gt;Remember the shared mechanism:&lt;/strong&gt; AI can address every specific claim a person raises, exhaustively and personalized to them — something no human debater can sustain at the same scale or speed.&lt;/div&gt;

# Key Ideas: Differences in Conversation

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-teal"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Why conversation is different&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - People treat conversations with AI more seriously and with more focus than they treat static text&lt;br&gt;
      - Turn-taking, personal address, and forced elaboration all plausibly deepen engagement
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-amber"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;But it's not a settled law&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Hackenburg et al. found dialogue beat static messages&lt;br&gt;
      - Argyle et al. found interactive elaboration did &lt;em&gt;not&lt;/em&gt; clearly beat a static message&lt;br&gt;
      - "Conversation beats static text" is an empirical, context-dependent claim — not a given
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-red" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;Consent is a live tension throughout this unit: how much must participants be told about an AI's persuasive goal, or its accuracy-persuasiveness tradeoff, without undermining the very effect being measured?&lt;/div&gt;

# Unit 5: AI and Society
## Governments, encyclopedias, surveys, productivity, homogenization, and sycophancy

---

# Key Ideas: Governments and Encyclopedias

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th style="width:20%;"&gt;Study&lt;/th&gt;&lt;th style="width:40%;"&gt;Headline finding&lt;/th&gt;&lt;th style="width:40%;"&gt;Key numbers&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Waight et al.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;State media control shapes LLM training data and outputs, even with no AI-specific policy&lt;/td&gt;&lt;td&gt;41× overrepresentation; ~80% pro-government shift from just 6,400 documents; effect tracks press freedom by query language&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Yasseri &amp;amp; Mohammadi&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;AI encyclopedias (Grokipedia) relocate bias rather than remove it&lt;/td&gt;&lt;td&gt;17,790 matched pairs; rightward shift concentrated in religion/history/lit/art; ~20 vs. ~35 references per 1,000 words&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Direct vs. indirect government control&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Direct = laws, licensing, mandated guardrails. Indirect = controlling the media environment that gets scraped into training data — no AI policy needed at all, and much harder to detect.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-purple"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;"AI-corrected" ≠ "unbiased"&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Grokipedia was built to fix Wikipedia's alleged bias — but bias didn't disappear, it moved to specific topics and became less contestable (no visible edit history).&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:250px; height:250px"&gt;
![](https://1000logos.net/wp-content/uploads/2017/05/Wikipedia-logos.jpg)

---

# Key Ideas: Surveys and Contamination

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Westwood — the core threat&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - An autonomous AI agent evaded survey-bot detection 99.8% of the time&lt;br&gt;
      - 10–52 fake responses (at ~5¢ each) could have flipped major 2024 election polls&lt;br&gt;
      - The agent could infer a researcher's hypothesis and bias answers to confirm it — targeted bias, not random noise
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-slate"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;O'Grady — the arms race&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Detection methods are consistently outpaced by model capability gains&lt;br&gt;
      - Publishing a new detector teaches future agents what to defeat&lt;br&gt;
      - "AI threatens to upend online social science research" — not just complicate it
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-amber" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;&lt;strong&gt;The contamination feedback loop:&lt;/strong&gt; AI-shaped media, encyclopedia content, and survey data all re-enter the pool that future models and future research treat as ground truth — the problem compounds rather than staying contained.&lt;/div&gt;

&lt;center&gt;

# Five Threads Running Through the Course

&lt;div class="cols-2" style="margin-top:0.5em; font-size:1em;"&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;1. Individual benefit vs. collective cost&lt;/div&gt;
    &lt;div style="line-height:1.7;"&gt;Daniotti et al., Hao et al., and Cheng et al. all show a gain at the individual level paired with a cost at the group or societal level.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;2. Bias is relocated, not removed&lt;/div&gt;
    &lt;div style="line-height:1.7;"&gt;Unit 2's demographic annotation bias, Waight et al.'s state-media influence, and Yasseri &amp;amp; Mohammadi's Grokipedia findings all show bias persisting in new, often less visible forms.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;3. Plausible ≠ valid&lt;/div&gt;
    &lt;div style="line-height:1.7;"&gt;Unit 3's silicon sampling critique, Unit 4's persuasion-accuracy tradeoff, and Cheng et al.'s "trusted but distorting" sycophancy findings all separate what &lt;em&gt;feels&lt;/em&gt; convincing from what is actually accurate or representative.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;4. Contamination and feedback loops&lt;/div&gt;
    &lt;div style="line-height:1.7;"&gt;Unit 3's worry about training on synthetic data and Unit 5's contamination feedback loop (Westwood, Waight, Grokipedia) describe the same underlying dynamic: AI output re-entering the pool treated as ground truth.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-indigo" style="grid-column: span 2;"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;5. Conversation and personalization as a double-edged tool&lt;/div&gt;
    &lt;div style="line-height:1.7;"&gt;The same adaptivity that makes AI a powerful research instrument (Unit 4's dynamic materials, Unit 3's silicon sampling) is what makes it a powerful, hard-to-regulate persuasion and homogenization technology outside the lab.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# ⚠️ Common Exam Pitfalls to Avoid

&lt;br&gt;

1. **Confusing "AI is persuasive" with "AI is accurate."** Hackenburg et al.'s tradeoff is a direct rebuttal to any answer that treats these as the same thing.

2. **Treating homogenization as a training-data problem alone.** Sourati et al.'s key contribution is that the training &lt;em&gt;process itself&lt;/em&gt; amplifies it, beyond just what's in the data.

3. **Forgetting the null results.** Argyle et al.'s finding that customization/elaboration didn't clearly help is easy to forget amid three studies that found large effects — but it's exactly the kind of nuance a strong exam answer includes.

4. **Missing the individual/collective distinction.** Several of this course's most important findings (Hao et al., Daniotti et al., Cheng et al.) only make sense once you separate the individual-level result from the collective-level result.

5. **Citing a finding without its number.** "AI is very persuasive" is a much weaker answer than "personalized GPT-4 beat human debaters 64.4% of the time (Salvi et al.)."

# Concept Check: Units 1–3 (True or False)

&lt;div class="cols-2" style="margin-top:0.5em; font-size:1em;"&gt;
  &lt;div class="box box-slate"&gt;1. Larger training datasets always produce better LLMs.&lt;/div&gt;
  &lt;div class="box box-slate"&gt;2. Chain-of-thought prompting speeds up generation while improving accuracy.&lt;/div&gt;
  &lt;div class="box box-slate"&gt;3. Alignment is unambiguously good for social science research applications.&lt;/div&gt;

  &lt;div class="box box-slate"&gt;5. Silicon-sampled data is representative on average but weaker on capturing variability.&lt;/div&gt;

# Concept Check: Units 4–5 (True or False)

&lt;div class="cols-2" style="margin-top:0.5em; font-size:1em;"&gt;
  &lt;div class="box box-slate"&gt;1. Argyle et al. found that message customization clearly outperformed a generic message.&lt;/div&gt;
  &lt;div class="box box-slate"&gt;2. Hackenburg et al. found persuasiveness and factual accuracy moved in the same direction.&lt;/div&gt;
  &lt;div class="box box-slate"&gt;3. Government influence over LLMs always requires an explicit AI-specific law.&lt;/div&gt;
  &lt;div class="box box-slate"&gt;4. Grokipedia's bias was spread evenly across all topic categories.&lt;/div&gt;
  &lt;div class="box box-slate"&gt;5. Westwood's detection-evasion rate was roughly 50%, comparable to chance.&lt;/div&gt;
  &lt;div class="box box-slate"&gt;6. Users in Cheng et al. rated sycophantic AI responses as lower quality despite the distortion.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-red" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;All six statements above are &lt;strong&gt;false&lt;/strong&gt; — Argyle's customization was a null result, Hackenburg's tradeoff runs in opposite directions, indirect government influence needs no explicit law, Grokipedia's shift concentrated in specific topics, Westwood's evasion rate was 99.8%, and users &lt;em&gt;preferred&lt;/em&gt; sycophantic responses despite the distortion.&lt;/div&gt;

# Exam Strategy Tips

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-indigo"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Before you write anything&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Identify which unit(s) a question is drawing on — many strong answers connect two units, so don't answer too narrowly&lt;br&gt;
      - If a number is central to a finding, include it — precision signals real command of the material
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-teal"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;While you write&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - Name the study, not just "a study showed..." — attribution matters&lt;br&gt;
      - When a finding has a nuance or null result attached (like Argyle et al.), mention it — it shows you're not oversimplifying&lt;br&gt;
      - For comparative questions, organize your answer around the axis of comparison, not just a list of facts about each study
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-amber" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;A strong exam answer usually looks like: &lt;em&gt;claim → supporting study and number → why it matters / what it connects to&lt;/em&gt;.&lt;/div&gt;
