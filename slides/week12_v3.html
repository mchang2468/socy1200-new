&lt;div class="section-num"&gt;I&lt;/div&gt;

# Governments
## How state control of media shapes what LLMs say

---

# Review: How Does Government Influence Reach an LLM?

**Government influence on AI outputs can travel through two very different channels.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Direct regulation&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;Laws requiring content review or removal before an AI system can be deployed&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;Licensing regimes controlling which companies can operate AI services in a jurisdiction&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;Mandated system prompts or guardrails imposed on deployed models&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Indirect influence, through training data&lt;/div&gt;
    &lt;div class="box box-navy" style="margin-bottom:0.3em; font-size:1em;"&gt;&lt;strong&gt;No explicit rule about AI at all&lt;/strong&gt; — just control over what gets published in the media environment the model later learns from&lt;/div&gt;
    &lt;div class="box box-navy" style="font-size:1em;"&gt;This channel requires no coordination with AI companies, no lawsuits, no visible policy — it works purely through what text exists on the internet to be scraped&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.5em;"&gt;Training data for LLMs does not simply fall from the sky — it is produced within social and political institutions, which shape the information environment that in turn shapes what models learn.&lt;cite&gt;— Waight et al. (2026)&lt;/cite&gt;&lt;/div&gt;

# Waight et al.: The Core Finding

&lt;div class="src"&gt;Waight, Yang, Yuan, Messing, Roberts, Stewart &amp;amp; Tucker 2026 · Nature&lt;/div&gt;

&lt;div class="box box-navy" style="margin:0.5em 0;"&gt;
  &lt;strong&gt;Central finding:&lt;/strong&gt; Government-controlled media influences the output of large language models via their training data. Models queried in the languages of countries with lower press freedom show a stronger pro-regime valence than models queried in the languages of countries with higher press freedom.
&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why this question is hard to answer&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;AI companies do not disclose their training data sources. Most scrutiny of political bias in AI has focused on model outputs — not on the source material the models actually learned from.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;The core mechanism&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;When a country restricts local media from criticizing its government, the resulting media environment — and therefore the training data scraped from it — contains less government criticism. LLMs trained on that data inherit the omission.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:300px; height:300px"&gt;

# Paper Walkthrough: Waight et al. — Six Studies, One Chain of Evidence

&lt;div class="src"&gt;Waight et al. 2026&lt;/div&gt;

**The design moves from documentation to experiment to real-world audit, so that no single study has to carry the whole claim.**

&lt;div class="box box-blue" style="margin-top:0.3em; font-size:1em;"&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Corpus documentation:&lt;/strong&gt; identify state-coordinated media content within a major open training dataset derived from Common Crawl&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;China case study:&lt;/strong&gt; compare two sources of Chinese state-coordinated media against that open training corpus&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Pretraining experiment:&lt;/strong&gt; deliberately continue training an open-weight model on a controlled set of state-scripted documents and measure the change in its outputs&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Commercial model audits:&lt;/strong&gt; test whether deployed commercial LLMs reproduce distinctive phrases traceable to state media&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;5&lt;/span&gt;&lt;div class="step-body"&gt;&lt;strong&gt;Cross-national analysis:&lt;/strong&gt; evaluate LLM outputs in the local languages of 37 countries, and compare against each country's press freedom score&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-blue" style="margin-top:0.3em; font-size:1em;"&gt;This is exactly the kind of layered design this course has emphasized: no one study proves causation alone, but documentation + controlled experiment + real-world audit together build a much stronger case.&lt;/div&gt;

# Results: State Media in the Training Data

&lt;div class="src"&gt;Waight et al. 2026&lt;/div&gt;

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th style="width:30%;"&gt;Study component&lt;/th&gt;&lt;th style="width:35%;"&gt;What was measured&lt;/th&gt;&lt;th style="width:35%;"&gt;Result&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;China corpus comparison&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Rate of state-scripted news vs. Chinese-language Wikipedia in a major open training dataset&lt;/td&gt;&lt;td&gt;State-scripted news appeared roughly &lt;strong&gt;41 times&lt;/strong&gt; more often than Chinese-language Wikipedia entries&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Commercial model audit&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Whether deployed models reproduce distinctive memorized phrases from state media&lt;/td&gt;&lt;td&gt;Models reproduced these phrases in roughly &lt;strong&gt;3–10%&lt;/strong&gt; of relevant responses&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Pretraining experiment&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Effect of continued training on just 6,400 state-scripted documents&lt;/td&gt;&lt;td&gt;The model produced substantially more pro-government responses — in the study's report, close to &lt;strong&gt;80%&lt;/strong&gt; of the time&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

&lt;div class="box box-navy" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;&lt;strong&gt;Why the small pretraining number matters:&lt;/strong&gt; 6,400 documents is a tiny fraction of a full training corpus — yet it was enough to measurably shift outputs. Concentrated, repeated state messaging appears to be disproportionately influential relative to its share of the data.&lt;/div&gt;

# 📊 Case Study: Why Repetition, Not Just Volume, Drove the Effect

**Waight et al. found that commercial models reproduced distinctive memorized phrases from state media — a signature of intentional, repeated messaging rather than incidental exposure.**

&lt;br&gt;

State-coordinated media campaigns often deliberately repeat specific phrases and framings across many platforms, precisely so that the messaging is seen and internalized by audiences. Waight et al.'s finding suggests that same repetition strategy leaves a disproportionate fingerprint in LLM training data — and, in turn, in memorized model outputs.

&lt;br&gt;

**Why this matters beyond China:** the mechanism Waight et al. document — deliberate repetition producing outsized representation in scraped training corpora — is not specific to any one government's media strategy. Any well-resourced, coordinated messaging campaign (state or otherwise) that saturates the online information environment could leave a similar fingerprint.

&lt;br&gt;

**The open question:** how would a research team detect this kind of influence for messaging campaigns that are less centralized, or for languages and countries not yet covered by an audit like this one?

# LLMs Favor the Country of Their Training Language

&lt;div class="src"&gt;Waight et al. 2026 · Cross-national analysis, 37 countries&lt;/div&gt;

&lt;div class="box box-navy" style="margin:0.5em 0;"&gt;
  &lt;strong&gt;Finding:&lt;/strong&gt; Ask the same political question in two different languages and you may get two very different answers. Models queried in the language of a country with lower press freedom show a stronger pro-regime valence than models queried in the language of a country with higher press freedom.
&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why language, not just topic, matters&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;A model doesn't have one single "political stance" — its stance can shift depending on which language's training data it draws on most heavily for a given query, since different languages draw from different regional media ecosystems.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Implication for global AI use&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Hundreds of millions of people, including inside enterprises, use commercial LLMs. If the language you query in shapes the political valence of the answer you get, "the same AI system" is not delivering the same political information everywhere.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Direct vs. Indirect Government Control of AI

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th style="width:20%;"&gt;Mechanism&lt;/th&gt;&lt;th style="width:40%;"&gt;How it works&lt;/th&gt;&lt;th style="width:40%;"&gt;Why it's hard to counter&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Direct regulation&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Explicit laws, licensing, mandated guardrails governing AI systems&lt;/td&gt;&lt;td&gt;Visible and contestable — can be litigated, reported on, and debated publicly&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl-red"&gt;&lt;td&gt;&lt;strong&gt;Indirect, via training data&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Controlling the media environment that gets scraped into training corpora, with no AI-specific policy at all&lt;/td&gt;&lt;td&gt;Invisible — no company discloses training sources, so the influence is undetectable without exactly the kind of forensic audit Waight et al. conducted&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

&lt;div class="box box-amber" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;The indirect channel is arguably the more consequential one for AI governance debates, precisely because it requires no AI-specific policy to work — and because most AI governance proposals focus on regulating deployment, not auditing the information ecosystem upstream of training.&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:400px; height:200px"&gt;
![](https://beaithink.com/wp-content/uploads/2025/08/AI-Regulation.webp)

# 💬 Discussion Question 1

**"How does government media control propagate into LLMs, and what should be done about it?"**

&lt;br&gt;

1. Waight et al.'s pretraining experiment shows that a small, concentrated set of documents (6,400) can shift a model's outputs substantially. If concentrated, repeated messaging is disproportionately influential, does this concern apply only to state actors — or could any well-funded organization achieve a similar effect by flooding the information environment?

2. If the mechanism is indirect — no AI-specific law required — what kind of intervention could actually address it? Is auditing training data sufficient, or does addressing this problem require addressing media freedom itself, upstream of AI entirely?

3. The cross-national finding means a single global AI product may give politically different answers depending on the language of the query. Should AI companies be required to disclose this kind of cross-lingual divergence to users?

# Encyclopedias
## Can an AI encyclopedia fix bias, or does it just relocate it?

---

# Review: What Wikipedia's Model Was Supposed to Guarantee

**Wikipedia's core promise was never perfect neutrality — it was a transparent, contestable process for approaching it.**

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Wikipedia's editorial model&lt;/div&gt;
    &lt;div class="box box-slate" style="margin-bottom:0.3em; font-size:1em;"&gt;Crowd-sourced, volunteer editors, with visible edit histories and talk-page debates&lt;/div&gt;
    &lt;div class="box box-slate" style="margin-bottom:0.3em; font-size:1em;"&gt;Citation-based verification: claims are expected to trace back to a checkable source&lt;/div&gt;
    &lt;div class="box box-slate" style="font-size:1em;"&gt;Bias can still creep in — but the process for contesting it is public&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;The AI-encyclopedia pitch&lt;/div&gt;
    &lt;div class="box box-navy" style="font-size:1em;"&gt;In October 2025, xAI launched Grokipedia, an AI-generated encyclopedia built on the Grok model, explicitly framed as a corrective to Wikipedia's alleged ideological bias — content is generated and "fact-checked" by the model rather than a community of editors&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.5em;"&gt;The question this section asks is not whether Wikipedia is biased — plenty of critics on multiple sides think it is — but whether replacing a contestable human process with an AI-generation process actually reduces bias, or just moves it somewhere less visible.&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:300px; height:150px"&gt;
![](https://metro.co.uk/wp-content/uploads/2025/11/GettyImages-2246858533-aadb.jpg?quality=90&amp;strip=all&amp;w=646)

---

# Mohammadi &amp;amp; Yasseri: The Core Finding

&lt;div class="src"&gt;Mohammadi &amp;amp; Yasseri 2026 · PNAS · 17,790 matched article pairs&lt;/div&gt;

&lt;div class="box box-purple" style="margin:0.5em 0;"&gt;
  &lt;strong&gt;Central finding:&lt;/strong&gt; Grokipedia does not uniformly "correct" Wikipedia's alleged biases. Instead, AI-generated encyclopedic content selectively diverges from Wikipedia in structure and sourcing — longer, less citation-dense, and, in a specific subset of politically and culturally sensitive topics, shifted toward more right-leaning news sources.
&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;What stayed similar&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:0.9em;"&gt;Overall political leaning across the full article set was broadly comparable between the two platforms — this is not a story of wholesale ideological capture&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Where the divergence concentrated&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:0.9em;"&gt;Among articles that diverged substantially, the rightward shift in cited sources concentrated specifically in religion, history, literature, and art — precisely the topics most sensitive to historical and cultural framing&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:450px; height:225px"&gt;
![](https://d3nwecxvwq3b5n.cloudfront.net/AcuCustom/Sitename/DAM/045/bias_in_AI1_Main.jpg)

---

class: paper-walk

# Paper Walkthrough: Mohammadi &amp;amp; Yasseri — The 17,790-Pair Comparison

&lt;div class="src"&gt;Mohammadi &amp;amp; Yasseri 2026 · Center for Sociology of Humans and Machines, Trinity College Dublin &amp;amp; TU Dublin&lt;/div&gt;

&lt;div class="box box-blue" style="margin-top:0.3em; font-size:1em;"&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;Sample the 20,000 most-edited English Wikipedia articles — heavy editing correlates with controversy and topical salience, which makes bias more likely to be visible&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;Match each Wikipedia article to its Grokipedia counterpart on the same topic — 17,790 usable matched pairs&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;Compare pairs across lexical richness, readability, structural organization, reference density, and semantic similarity&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;For the subset of articles that diverge substantially in content, map cited news sources to an established political-leaning dataset built from social media sharing patterns&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num green"&gt;5&lt;/span&gt;&lt;div class="step-body"&gt;Break results down by topic category to locate where divergence concentrates&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-blue" style="margin-top:0.3em; font-size:1em;"&gt;The scale here (17,790 pairs) is what makes the topic-level breakdown credible — a handful of anecdotal examples couldn't distinguish "AI encyclopedias are biased" from "these two particular articles are biased."&lt;/div&gt;

&lt;div style="width:350px; height:175px"&gt;

# Results: Historical and Religious Bias in AI Encyclopedias

&lt;div class="src"&gt;Mohammadi &amp;amp; Yasseri 2026&lt;/div&gt;

&lt;div class="box box-red" style="margin:0.5em 0; text-align:center; font-size:1em;"&gt;Among articles where Grokipedia's content diverged substantially from Wikipedia's, cited news sources showed a systematic rightward shift — concentrated specifically in articles about &lt;strong&gt;religion, history, literature, and art&lt;/strong&gt;.&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-slate"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;Why these topics specifically&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      -These are exactly the categories most dependent on interpretive framing rather than settled fact&lt;br&gt;
      -Historical and religious narratives often have contested "correct" framings across ideological lines&lt;br&gt;
      -A model trained partly on more polarized commentary about these topics may reproduce that polarization
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-amber"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;The researchers' framing&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      -Not a claim that Grokipedia is uniformly "far-right"&lt;br&gt;
      -A claim that AI generation &lt;em&gt;relocates&lt;/em&gt; bias into specific topic areas and makes it less visible than a contestable, citation-checkable Wikipedia edit
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Grokipedia vs. Wikipedia, By the Numbers

&lt;div class="src"&gt;Mohammadi &amp;amp; Yasseri 2026; corroborated by independent analyses of the Grokipedia corpus&lt;/div&gt;

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th style="width:30%;"&gt;Metric&lt;/th&gt;&lt;th style="width:35%;"&gt;Wikipedia&lt;/th&gt;&lt;th style="width:35%;"&gt;Grokipedia&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl"&gt;&lt;td&gt;&lt;strong&gt;Article length&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Shorter, on matched topics&lt;/td&gt;&lt;td&gt;Substantially longer&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Reading level required&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;~10.7 grade level&lt;/td&gt;&lt;td&gt;~14.5 grade level — notably harder to read&lt;/td&gt;&lt;/tr&gt;

&lt;/table&gt;

&lt;div class="box box-navy" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;&lt;strong&gt;The pattern:&lt;/strong&gt; more words, harder to read, and proportionally less grounded in checkable citations — exactly the profile of "narrative expansion over citation-based verification."&lt;/div&gt;

# Results: Favoring Narrative Over Citation-Based Verification

&lt;div class="src"&gt;Mohammadi &amp;amp; Yasseri 2026&lt;/div&gt;

&lt;div class="box box-purple" style="margin:0.5em 0;"&gt;
  &lt;strong&gt;Finding:&lt;/strong&gt; AI-generated encyclopedic content departs from established editorial norms, favoring narrative expansion over citation-based verification — raising questions about transparency, provenance, and the governance of knowledge in automated information systems.
&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why fewer citations per word matters&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;A Wikipedia claim is expected to trace to a source a reader can check. An AI-generated claim can be fluent and confident without that same per-claim traceability — length substitutes for verifiability.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;A related, independent finding&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;A separate analysis of the full Grokipedia corpus (Triedman &amp;amp; Mantzarlis, Cornell Tech) found Grokipedia cites a number of sources rated "generally unreliable" or blacklisted by the Wikipedia community — a further sign of loosened sourcing standards, not just fewer citations overall.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:250px; height:250px"&gt;
![](https://img.magnific.com/premium-vector/book-fairy-tale-story_1308-24576.jpg?semt=ais_hybrid)

# 📊 Case Study: "Fixing" Wikipedia's Bias, or Relocating It?

**Grokipedia was launched with an explicit promise: to "purge the propaganda" and correct Wikipedia's alleged left-leaning bias, delivering "the truth, the whole truth and nothing but the truth."**

&lt;br&gt;

**What the evidence actually shows:** overall political leaning across the full 17,790-pair comparison was broadly similar between the two platforms. The promised wholesale correction didn't clearly materialize as a uniform shift.

&lt;br&gt;

**What did happen:** bias didn't disappear — it moved. It concentrated in specific topic categories (religion, history, literature, art) and became harder to detect, because Grokipedia's process lacks Wikipedia's visible edit history, talk-page debate, and per-claim citation density.

&lt;br&gt;

**The pattern worth naming:** a platform explicitly built to fix a rival's bias can still be biased — just differently, and less transparently. This is a case study in why "AI-corrected" is not the same claim as "unbiased."

class: discussion

# 💬 Discussion Question 2

**"AI-generated encyclopedias are historically and religiously biased, and tend to favor narrative over citation-based verification — what follows from that?"**

&lt;br&gt;

1. Grokipedia's content is, by design, generated by a single company's model rather than negotiated among thousands of independent volunteer editors. Even setting aside the specific rightward shift documented here, does that structural difference alone make an AI encyclopedia less trustworthy as a reference source — regardless of which direction any bias runs?

2. Mohammadi and Yasseri found the bias concentrated in religion, history, literature, and art — not, say, science or technology articles. Why might interpretive, narrative-heavy topics be more susceptible to this kind of drift than fact-dense technical topics?

3. If citation-based verification is what let Wikipedia's biases be contested and corrected over time, what would an equivalent accountability mechanism look like for an AI-generated encyclopedia — and is it possible to build one without reintroducing a human editorial layer?

# Surveys
## When you can no longer assume your respondents are human

---

# Westwood: The Core Finding

&lt;div class="src"&gt;Westwood 2025 · PNAS · 2025 Cozzarelli Prize, Behavioral and Social Sciences&lt;/div&gt;

&lt;div class="box box-red" style="margin:0.5em 0;"&gt;
  &lt;strong&gt;Central finding:&lt;/strong&gt; Autonomous AI agents, built from a simple prompt, can complete online surveys with responses that evade nearly every existing detection method — fundamentally compromising the assumption that logically coherent survey responses come from humans.
&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why online surveys matter this much&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Surveys are a primary data source across medicine, economics, political science, and public health. Thousands of peer-reviewed studies each year rely on unsupervised online data collection.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Westwood's own framing&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;"We can no longer trust that survey responses are coming from real people... With survey data tainted by bots, AI can poison the entire knowledge ecosystem."&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:400px; height:200px"&gt;
![](https://seoarcade.com/wp-content/uploads/2023/05/image-6.png)

---

class: paper-walk

# Paper Walkthrough: Westwood — Building the Autonomous Synthetic Respondent

&lt;div class="src"&gt;Westwood 2025&lt;/div&gt;

**The design goal: build the simplest possible AI agent that could pass as a real survey-taker, to establish a lower bound on the threat.**
&lt;div class="box box-blue" style="margin-top:0.3em; font-size:1em;"&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;Build a model-agnostic Python agent, deployable via API (OpenAI, Anthropic, Google) or locally with open-weight models&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;Give the agent a single prompt of roughly 500 words specifying a persona and instructing it to answer like a human&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;Deploy the agent against real survey platforms and state-of-the-art bot-detection methods — attention checks, behavioral flags, response-pattern analysis, and specialized AI-detection tools&lt;/div&gt;&lt;/div&gt;
&lt;div class="step-row"&gt;&lt;span class="step-num red"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;Test robustness: different underlying models (o4-mini, DeepSeek R1, Mistral Large, Claude 3.7 Sonnet, Grok 3, Gemini 2.5), and prompts written in Russian, Mandarin, or Korean&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-blue" style="margin-top:0.3em; font-size:1em;"&gt;Notice the minimalism: a single ~500-word prompt, not a custom-built evasion system. The threat model is "what a single moderately sophisticated user could do this afternoon," not a nation-state operation.&lt;/div&gt;

---

# How the Agent Beat Every Detection Method

&lt;div class="src"&gt;Westwood 2025&lt;/div&gt;

&lt;table class="styled-table"&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th style="width:26%;"&gt;Detection method&lt;/th&gt;&lt;th style="width:38%;"&gt;What it normally catches&lt;/th&gt;&lt;th style="width:36%;"&gt;How the agent evaded it&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;
    &lt;tr class="hl-red"&gt;&lt;td&gt;&lt;strong&gt;Attention check questions&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Inattentive humans clicking through without reading&lt;/td&gt;&lt;td&gt;Agent read and answered correctly every time — it never clicks through inattentively&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Impossible-biography traps&lt;/strong&gt;&lt;br&gt;&lt;span style="font-size:1em; font-weight:400;"&gt;e.g., "have you visited the moon," "were you elected president"&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Bots that answer inconsistently or absurdly&lt;/td&gt;&lt;td&gt;Zero errors across trials — the agent reliably declined the impossible claims&lt;/td&gt;&lt;/tr&gt;
    &lt;tr class="hl-red"&gt;&lt;td&gt;&lt;strong&gt;Behavioral / biometric flags&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Bots that type unnaturally fast or move the mouse in straight lines&lt;/td&gt;&lt;td&gt;Agent used humanlike mouse movement and typed letter-by-letter at realistic speed, including typos it then corrected&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Specialized AI-response detectors&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Text with statistical fingerprints of LLM generation&lt;/td&gt;&lt;td&gt;Evaded detection in roughly &lt;strong&gt;99.8%&lt;/strong&gt; of attempts across the study&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;
&lt;/table&gt;

&lt;div class="box box-red" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;Every layer of defense researchers currently rely on — including a paper specifically designed to detect AI survey responses — was defeated by a single generic prompt.&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:350px; height:175px"&gt;
![](https://images.detecting-ai.com/posts_top-10-free-ai-detectors-features-accuracy-and-limitations_6795bf837c4cb25d9013ed6c-1ab21e6fe35c06a3c150ec2ec3caf067.webp)

---

# AI Survey Responses Can Intentionally Confirm Hypotheses

&lt;div class="src"&gt;Westwood 2025 — demand effects&lt;/div&gt;

&lt;div class="box box-red" style="margin:0.5em 0;"&gt;
  &lt;strong&gt;Finding:&lt;/strong&gt; When the AI agent encountered a common experimental design, it often inferred the researcher's hypothesis on its own and then biased its answers to confirm that hypothesis — while still maintaining realistic response variation, making the pattern hard to spot.
&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why this is worse than random noise&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Older survey fraud (click-farms, careless respondents) added &lt;em&gt;random&lt;/em&gt; noise — it made estimates less precise, but didn't systematically point them in a false direction. AI-generated demand-effect responses introduce &lt;em&gt;targeted&lt;/em&gt; bias — they corrupt findings from within by confirming what researchers already expected to see.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Weaponizable with one instruction&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;With a single instruction, the same agent can be redirected to systematically bias polling results in a chosen direction — Westwood explicitly frames this as usable for coordinated information warfare, not just accidental contamination.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:350px; height:175px"&gt;
![](https://img.magnific.com/premium-vector/young-good-looking-man-holding-board-said-yes_97632-4260.jpg)

# Real-World Stakes: The 2024 Election Polls

&lt;div class="src"&gt;Westwood 2025&lt;/div&gt;

# ⚖️ Debate: Should Survey Platforms Require Proof of Humanness?

**Westwood's agent evaded every layer of defense platforms like Prolific and CloudResearch currently deploy. What should platforms and researchers do?**

&lt;br&gt;

**The case for strict identity verification:**

If 10–52 fake responses can flip a national poll, the status quo is not a minor data-quality issue — it is an existential threat to a core method of social science. Verified phone numbers, payment history, and cross-referencing against public records (like voter files) could raise the cost of running an AI agent at scale.

&lt;br&gt;

**The case against strict verification:**

Identity verification excludes vulnerable and marginalized populations who lack the required documentation — exactly the groups survey research most needs to reach for representative, equitable data. It also creates a privacy-invasive honeypot of personal data, and determined bad actors can likely still find workarounds.

&lt;br&gt;

**Is there a middle path — and does it need to look different for academic research than for commercial polling?**

# The Best LLMs Now Evade Detection Systems

&lt;div class="src"&gt;Synthesizing Westwood 2025 and O'Grady 2026&lt;/div&gt;

&lt;div class="box box-red" style="margin:0.5em 0;"&gt;
  &lt;strong&gt;The headline number to hold onto:&lt;/strong&gt; a generic, publicly describable AI agent evaded state-of-the-art survey-bot detection 99.8% of the time — including detectors specifically designed and published to catch AI-generated survey responses.
&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;This is not unique to surveys&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:0.9em;"&gt;The same underlying capability — producing fluent, humanlike, contextually appropriate text and behavior — that lets a model evade a survey detector also lets AI-generated text blend into any other corpus it enters: web pages, encyclopedia articles, social media posts.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why "best" models are the problem, not the exception&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:0.9em;"&gt;Westwood tested multiple frontier models (o4-mini, Claude 3.7 Sonnet, Gemini 2.5, Grok 3, and others) and found the evasion capability was broadly shared across them — this is a property of frontier-level fluency, not one company's failure.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Why Detection Is a Losing Arms Race

&lt;div class="cols-3" style="margin-top:0.5em;"&gt;
  &lt;div class="box box-slate"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Publication paradox&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7;"&gt;Publishing a new detection method (a necessary step for peer review and replication) simultaneously teaches future agents exactly what to defeat&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-slate"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Asymmetric cost&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7;"&gt;Building a robust detector is a research project; defeating one can be a single prompt — the effort required to attack is far lower than the effort required to defend&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-slate"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Capability drift&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.7;"&gt;As general-purpose model capability improves for unrelated reasons (better reasoning, more humanlike text), evasion ability improves as a side effect — no one has to specifically train a model to beat detectors&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.6em;"&gt;Detection-based defenses treat contamination as a problem to be caught after the fact. But if evasion improves as a side effect of general capability gains, "catch it after the fact" is a strategy with a shrinking shelf life.&lt;/div&gt;

# ⚠️ Contamination as a Compounding Problem

**Each of this week's studies documents AI-generated or AI-shaped content entering a corpus that future systems — and future research — will draw on.**

&lt;br&gt;

**The loop, made concrete with this week's own studies:**

Government-influenced media (Waight et al.) becomes training data for the next generation of models. AI-generated encyclopedia content (Mohammadi &amp;amp; Yasseri) is published to the open web, where future training-data crawlers cannot easily distinguish it from human-written text. AI-generated survey responses (Westwood) corrupt published datasets, which may themselves later be cited, summarized, or even scraped as source material.

&lt;br&gt;

**Why "compounding" is the right word, not just "widespread":** each of these contamination sources doesn't just add noise once — it becomes part of the substrate that the *next* model, the *next* encyclopedia comparison, or the *next* survey-detection method has to be built on. Errors and biases don't stay contained to one dataset; they propagate forward.

&lt;br&gt;

**This is the same feedback-loop concern researchers call "model collapse" when AI-generated content increasingly displaces human-generated content in what future models learn from.**

# The Contamination Feedback Loop

&lt;div class="cols-4" style="margin-top:0.6em; font-size:1em;"&gt;
  &lt;div class="box box-navy" style="text-align:center;"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;1. Source&lt;/div&gt;
    &lt;div style="line-height:1.6;"&gt;State media, AI encyclopedias, and AI survey agents each generate or shape text&lt;/div&gt;
  &lt;/div&gt;

    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;2. Publication&lt;/div&gt;

  &lt;/div&gt;
  &lt;div class="box box-navy" style="text-align:center;"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;3. Ingestion&lt;/div&gt;
    &lt;div style="line-height:1.6;"&gt;Future model training and future research both draw on this now-contaminated pool&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-navy" style="text-align:center;"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;4. Amplification&lt;/div&gt;
    &lt;div style="line-height:1.6;"&gt;Biases and errors are reproduced, sometimes intensified, in the next generation of models and studies&lt;/div&gt;

&lt;div class="box box-amber" style="margin-top:0.6em; text-align:center; font-size:1em;"&gt;Notice this loop has no natural stopping point — each of this week's four papers documents one entry point into the same cycle, not four unrelated problems.&lt;/div&gt;

# 💬 Discussion Question 4

**"If contamination compounds and detection is a losing arms race, what should the field actually do?"**

&lt;br&gt;

1. If the same underlying capability lets AI evade survey detectors, populate biased encyclopedia content, and reproduce state media phrasing, is "contamination" really four separate problems (governments, encyclopedias, surveys, training data) — or one problem showing up in four places? Does that change what a solution should target?

2. Some fields (e.g., clinical trials) rely heavily on in-person, verified data collection specifically because of fraud risk. Should social science follow that model more broadly now — and what would be lost if online, unsupervised data collection became rare again?

3. Waight et al., Mohammadi &amp;amp; Yasseri, and Westwood all required extensive, resource-intensive forensic work to even detect their respective problems. Is bias/contamination detection now a specialized subfield of its own — and if so, who should be responsible for funding and staffing it?

  &lt;div&gt;
    &lt;div style="font-weight:700; color:#2a5bd7; margin-bottom:0.4em;"&gt;Points back to earlier weeks&lt;/div&gt;
    &lt;div class="box box-slate" style="margin-bottom:0.3em;"&gt;&lt;strong&gt;Weeks 4–5 (Bias and measurement):&lt;/strong&gt; Waight et al. and Mohammadi &amp;amp; Yasseri are large-scale, high-stakes instances of the demographic and cultural bias patterns introduced earlier in the course.&lt;/div&gt;
    &lt;div class="box box-slate" style="margin-bottom:0.3em;"&gt;&lt;strong&gt;Weeks 6–7 (Synthetic people):&lt;/strong&gt; Westwood's synthetic respondents are silicon sampling turned adversarial — the same capability used earlier to simulate humans for research is now used to impersonate them without disclosure.&lt;/div&gt;
    &lt;div class="box box-slate"&gt;&lt;strong&gt;Week 11 (Persuasion):&lt;/strong&gt; Westwood's demand-effect finding is a direct descendant of Hackenburg et al.'s persuasion-accuracy tradeoff — AI optimizing to satisfy an inferred goal at the expense of truthfulness.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:700; color:#2e5c8a; margin-bottom:0.4em;"&gt;Points forward&lt;/div&gt;
    &lt;div class="box box-slate" style="margin-bottom:0.3em;"&gt;&lt;strong&gt;Week 14 (AI and Society, Part 2):&lt;/strong&gt; This week covered AI shaping information and research infrastructure; Week 14 turns to AI's effects on productivity, homogenization, and sycophancy in daily use.&lt;/div&gt;
    &lt;div class="box box-slate"&gt;&lt;strong&gt;Sourati et al. (Week 14):&lt;/strong&gt; The homogenization concern previewed here — many models converging on similar, less diverse outputs — is examined directly.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# Key Takeaways

&lt;div class="cols-2" style="margin-top:0.6em; font-size:1em;"&gt;
  &lt;div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;1&lt;/span&gt;&lt;div class="step-body"&gt;Government influence over LLMs can be entirely indirect — through the media environment scraped into training data, with no AI-specific policy involved&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;2&lt;/span&gt;&lt;div class="step-body"&gt;Concentrated, repeated messaging is disproportionately influential relative to its share of training data — a small, coordinated corpus can shift outputs measurably&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;3&lt;/span&gt;&lt;div class="step-body"&gt;An AI encyclopedia built to "fix" bias can still be biased — just relocated to specific topics and made less contestable&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;4&lt;/span&gt;&lt;div class="step-body"&gt;The core assumption behind unsupervised online surveys — that a coherent response came from a human — is no longer safe to make&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;5&lt;/span&gt;&lt;div class="step-body"&gt;AI survey agents can infer and confirm a researcher's hypothesis, producing targeted bias that's harder to catch than random noise&lt;/div&gt;&lt;/div&gt;
    &lt;div class="step-row"&gt;&lt;span class="step-num navy"&gt;6&lt;/span&gt;&lt;div class="step-body"&gt;All four problems feed a single compounding loop: AI-shaped content enters the pool that the next model or study treats as ground truth&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
