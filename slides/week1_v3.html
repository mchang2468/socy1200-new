# Welcome to SOCY 1200

**Introduction to Using AI to Study Society**

&lt;div class="box box-gold" style="margin-top:0.7em; text-align:center; font-size:1.1em;"&gt;Over the next 16 weeks, we'll study how AI — especially large language models — is changing the practice of social science, and what that means for society more broadly.&lt;/div&gt;

&lt;div class="cols-3" style="margin-top:0.6em;"&gt;
  &lt;div class="box box-slate" style="text-align:center;"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Not just AI&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.6;"&gt;This is a social science methods course that happens to use AI as its central case.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-slate" style="text-align:center;"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Not just methods&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.6;"&gt;We'll also study AI's effects on society — governments, knowledge, science, daily life.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-slate" style="text-align:center;"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.3em;"&gt;Hands-on&lt;/div&gt;
    &lt;div style="font-size:1em; line-height:1.6;"&gt;Expect paper walkthroughs, debates, case studies, and discussion every week.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

# The Five Units of This Course

&lt;div style="color:#aaa; font-size:1em; margin-top:1em;"&gt;How the semester is organized, week by week&lt;/div&gt;

# Unit 1: Introduction

&lt;div class="box box-gold" style="margin:0.6em 0; text-align:center; font-size:1.05em;"&gt;&lt;strong&gt;Weeks 1–2&lt;/strong&gt; — What is "AI" today, and how is it different from what came before?&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;What we'll cover&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Modern AI vs. earlier AI; embeddings, attention, and transformer architecture; training data, fine-tuning, and instruction-tuning; alignment and its tradeoffs for research&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why it comes first&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Everything later in the course assumes a working understanding of what LLMs actually are and how they're built — this unit gives you that foundation&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:600px; height:300px"&gt;
![](https://cdn.vectorstock.com/i/500p/26/97/artificial-intelligence-concept-technology-vector-35592697.jpg)

---

# Unit 2: Prompting

&lt;div class="box box-gold" style="margin:0.6em 0; text-align:center; font-size:1.05em;"&gt;&lt;strong&gt;Weeks 3–5&lt;/strong&gt; — Prompting, with application to measurement&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;What we'll cover&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;What good prompting looks like; using AI to measure things about society in data; bias, systematic errors, and how to correct for them&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why it matters&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Prompting is a genuinely learnable skill, and increasingly central to how social scientists actually use AI in their research — this unit treats it as a methods topic, not a trick&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:600px; height:300px"&gt;
![](https://ph-files.imgix.net/aef2db33-bc9d-4971-8fc6-28c28c682944.png?auto=compress&amp;codec=mozjpeg&amp;cs=strip&amp;auto=format&amp;fit=max)

---

# Unit 3: Synthetic People

&lt;div class="box box-gold" style="margin:0.6em 0; text-align:center; font-size:1.05em;"&gt;&lt;strong&gt;Weeks 6–8&lt;/strong&gt; — Can AI stand in for human research participants?&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;What we'll cover&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Silicon sampling and its appeal; its real limitations around variability and reproducibility; mixed-subjects designs and prediction-powered inference&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why it matters&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;As traditional polling and survey research face real challenges, synthetic data is being adopted quickly — often faster than it's been validated&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:600px; height:300px"&gt;
![](https://www.irix.my/newsroom/2024/img/massive-data-handling-capabilities.png)

---

# Unit 4: AI in Experiments

&lt;div class="box box-gold" style="margin:0.6em 0; text-align:center; font-size:1.05em;"&gt;&lt;strong&gt;Weeks 9–11&lt;/strong&gt; — Using AI to design and administer experimental treatments&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;What we'll cover&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;A midterm review and exam; dynamically generated experimental materials; AI-conducted conversations as the treatment itself; how persuasive AI really is&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why it matters&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;The same properties that make AI a powerful research tool for administering treatments make it a powerful — and understudied — persuasion technology outside the lab&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;center&gt;
&lt;div style="width:550px; height:275px"&gt;
![](https://static.vecteezy.com/system/resources/previews/067/197/215/non_2x/recruitment-nextgen-ux-asset-vector.jpg)

# Unit 5: AI and Society

&lt;div class="box box-gold" style="margin:0.6em 0; text-align:center; font-size:1.05em;"&gt;&lt;strong&gt;Weeks 12–14&lt;/strong&gt; — Zooming out from methods to societal-scale effects&lt;/div&gt;

&lt;div class="cols-2" style="margin-top:0.4em;"&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;What we'll cover&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;Government influence over AI; bias in AI-generated encyclopedias; AI in online surveys; AI's effects on productivity, science, homogenization, and sycophancy&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div style="font-weight:600; font-size:1em; margin-bottom:0.4em;"&gt;Why it matters&lt;/div&gt;
    &lt;div style="line-height:1.7; font-size:1em;"&gt;This unit connects the methodological questions from earlier in the course to the largest-scale question of all: what happens to a society whose information ecosystem, research infrastructure, and daily habits are all shaped by the same few AI systems?&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="box box-amber" style="margin-top:0.5em; text-align:center; font-size:1em;"&gt;Weeks 15–16 wrap up with catch-up, review, and the final exam.&lt;/div&gt;

# What This Course Is (and Isn't)

&lt;div class="cols-2" style="margin-top:0.6em;"&gt;
  &lt;div class="box box-green"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;What this course is&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - A social science methods course, using AI as its central, current case&lt;br&gt;
      - A place to read real, recent, sometimes-still-contested research closely&lt;br&gt;
      - A space for genuine debate — several weeks are built around structured disagreement
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class="box box-red"&gt;
    &lt;div style="font-weight:700; margin-bottom:0.4em;"&gt;What this course isn't&lt;/div&gt;
    &lt;div style="line-height:1.8; font-size:1em;"&gt;
      - A computer science or machine learning course — we won't be building models from scratch&lt;br&gt;
      - A course that takes a fixed ideological position on whether AI is "good" or "bad" for society&lt;br&gt;
      - A course where the material is settled — several readings we'll cover were published in the last few months
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="quote" style="margin-top:0.5em;"&gt;Because this field moves so fast, some of what we read this semester may already be contested, revised, or even retracted by the time we discuss it — that's not a flaw in the course, it's part of what makes studying AI and society right now genuinely interesting.&lt;/div&gt;

# 💬 Discussion: Your Own AI Use, Before We Start

**Before we get into any papers, let's take stock of where the room already is.**

&lt;br&gt;

1. How often do you currently use AI tools (ChatGPT, Claude, or others) in your daily life or coursework? What do you mainly use them for?

2. Has an AI tool ever surprised you — either by being much better, or much worse, than you expected at something?

3. What's one question about AI and society you're hoping this course will help you answer by the end of the semester?

&lt;br&gt;

&lt;div class="box box-amber" style="font-size:1em;"&gt;There are no wrong answers here — the goal is just to surface what the room already thinks, so we can revisit these same questions at the end of the semester and see what's changed.&lt;/div&gt;
